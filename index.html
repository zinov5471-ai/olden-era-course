<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Olden Era: С нуля / From Scratch</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14121F;
    --bg-elevated: #1D1A2E;
    --gold: #C9A15C;
    --gold-dim: #7A6538;
    --violet: #8B6FC9;
    --parchment: #EDE6D6;
    --parchment-dim: #A8A2B8;
    --danger: #C9605C;
    --success: #6FA97A;
    --radius: 14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; overflow-anchor: none;}
  /* ВАЖНО: html/body больше не скроллятся сами — весь скролл идёт
     внутри #app. Так рекомендует сама документация Telegram Mini Apps:
     когда tg.disableVerticalSwipes() активен (нужен, чтобы человек не
     закрывал бота случайным свайпом вниз), а страницу скроллит body
     напрямую, WebView иногда перехватывает жест и не отдаёт его обычной
     прокрутке — из-за этого страница "зависает" и не листается с первого
     свайпа. Отдельный внутренний скролл-контейнер убирает этот конфликт. */
  html,body{
    height: 100%;
    overflow: hidden;
  }
  body{
    background: radial-gradient(ellipse at top, #201C33 0%, var(--bg) 55%);
    color: var(--parchment);
    font-family: 'Manrope', sans-serif;
  }
  h1,h2,h3, .display{
    font-family: 'Cinzel', serif;
    letter-spacing: 0.02em;
  }
  #app{
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 18px 40px;
    height: 100%;
    position: relative;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* ---------- Language select screen ---------- */
  .lang-view{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height: 90vh;
    text-align:center;
  }
  .lang-view .badge{
    font-size: 40px;
    margin-bottom: 16px;
  }
  .lang-view h1{
    font-size: 24px;
    margin: 0 0 8px;
  }
  .lang-view p{
    color: var(--parchment-dim);
    font-size: 14px;
    margin: 0 0 28px;
  }
  .lang-options{
    display:flex;
    flex-direction:column;
    gap: 12px;
    width: 100%;
    max-width: 320px;
  }
  .lang-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    background: var(--bg-elevated);
    border: 1px solid rgba(201,161,92,0.2);
    color: var(--parchment);
    font-family:'Manrope';
    font-weight: 700;
    font-size: 15px;
    padding: 16px;
    border-radius: 12px;
    cursor:pointer;
  }
  .lang-btn:active{ transform: scale(0.98); }
  .lang-btn .flag{ font-size: 20px; }

  /* ---------- Header ---------- */
  .app-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 18px;
  }
  .app-header .eyebrow{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--gold);
    font-weight: 700;
  }
  .eyebrow{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 2px;
  }
  .app-header h1{
    font-size: 22px;
    margin: 2px 0 0;
    color: var(--parchment);
  }
  h1{
    font-size: 22px;
    margin: 2px 0 18px;
    color: var(--parchment);
  }
  .lang-toggle{
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(201,161,92,0.2);
    color: var(--parchment-dim);
    font-family:'Manrope';
    font-size: 12px;
    font-weight: 700;
    padding: 7px 12px;
    border-radius: 20px;
    cursor:pointer;
    flex-shrink:0;
  }

  /* ===== ПРОГРЕСС-БАР ===== */
  .progress-wrap {
    margin: 12px 0 18px;
  }
  .progress-label-row {
  display: flex;
  justify-content: space-between;
  font-size: 15px;
  font-weight: 700;
  color: var(--parchment);
  margin-bottom: 6px;
}
  .progress-track {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    border-radius: 4px;
    transition: width 0.6s ease;
  }

  /* ===== КНОПКА YOUTUBE (в стиле доната) ===== */
.youtube-btn {
  display: block;
  width: 100%;
  text-align: center;
  background: none;
  border: none;
  color: var(--parchment-dim);
  font-family: 'Manrope', sans-serif;
  font-size: 12.5px;
  padding: 18px 0 4px;
  cursor: pointer;
  opacity: 0.7;
  transition: opacity 0.2s ease;
}
.youtube-btn:active {
  opacity: 1;
  transform: scale(0.98);
}

  /* ---------- Charge indicator (signature element) ---------- */
  .charges{
    display:flex;
    gap: 6px;
    margin-top: 10px;
  }
  .charge-dot{
    flex:1;
    height: 6px;
    border-radius: 4px;
    background: rgba(255,255,255,0.08);
    position: relative;
    overflow: hidden;
  }
  .charge-dot.filled{
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    box-shadow: 0 0 10px rgba(201,161,92,0.55);
  }
  .charge-dot.current::after{
    content:'';
    position:absolute;
    inset:0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    animation: shimmer 1.8s infinite;
  }
  @keyframes shimmer{
    0%{ transform: translateX(-100%);}
    100%{ transform: translateX(100%);}
  }

  .progress-label{
    font-size: 12px;
    color: var(--parchment-dim);
    margin-top: 8px;
  }

  /* ---------- Lesson list ---------- */
  .lesson-list{
    display:flex;
    flex-direction:column;
    gap: 10px;
    margin-top: 18px;
  }
  .lesson-card{
    display:flex;
    align-items:center;
    gap: 14px;
    background: var(--bg-elevated);
    border: 1px solid rgba(201,161,92,0.12);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor:pointer;
    transition: transform .15s ease, border-color .15s ease;
  }
  .lesson-card:active{ transform: scale(0.98); }
  .lesson-card.done{ border-color: rgba(111,169,122,0.4); }
  .lesson-card.locked{ opacity: 0.45; }
  .lesson-num{
    font-family:'Cinzel', serif;
    font-size: 13px;
    font-weight: 700;
    width: 30px;
    height:30px;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(201,161,92,0.12);
    color: var(--gold);
    flex-shrink:0;
  }
  .lesson-card.done .lesson-num{
    background: rgba(111,169,122,0.18);
    color: var(--success);
  }
  .lesson-title{
    font-size: 15px;
    font-weight: 700;
    color: var(--parchment);
  }
  .lesson-sub{
    font-size: 12px;
    color: var(--parchment-dim);
    margin-top: 2px;
  }
  .lesson-check{
    margin-left:auto;
    font-size: 18px;
    color: var(--success);
  }
  .topic-icon{
    font-size: 20px;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: rgba(201,161,92,0.1);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .topic-progress{
    font-size: 11px;
    color: var(--parchment-dim);
    margin-top: 2px;
  }
  .soon-badge{
    margin-left:auto;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
    color: var(--parchment-dim);
    background: rgba(255,255,255,0.06);
    padding: 4px 10px;
    border-radius: 20px;
    flex-shrink:0;
  }
  .lesson-card.soon{
    opacity: 0.6;
    cursor: default;
  }
  .lesson-card.soon:active{ transform: none; }
  .support-link{
    display:block;
    width:100%;
    text-align:center;
    background: none;
    border: none;
    color: var(--parchment-dim);
    font-family:'Manrope';
    font-size: 12.5px;
    padding: 18px 0 4px;
    cursor:pointer;
    opacity: 0.7;
  }
  .support-link:active{ opacity: 1; }

  /* ---------- Lesson view ---------- */
  .lesson-view{ display:none; }
  .lesson-view.active{ display:block; }
  #lang-view.hidden{ display:none; }

  /* ===== ОТДЕЛЬНЫЕ СТРАНИЦЫ С АНИМАЦИЕЙ ===== */
  #topics-view,
  #home-view,
  #lesson-view {
    position: relative;
    transition: opacity 0.35s ease, transform 0.35s ease;
    background: transparent;
    padding: 0;
    min-height: 80vh;
  }

  /* Скрытые страницы */
  #topics-view.hidden,
  #home-view.hidden,
  #lesson-view.hidden {
    display: block !important;
    opacity: 0;
    transform: translateX(30px);
    pointer-events: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    min-height: 80vh;
  }

  /* Видимые страницы */
  #topics-view:not(.hidden),
  #home-view:not(.hidden),
  #lesson-view:not(.hidden) {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
    position: relative;
  }

  /* Анимация входа */
  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateX(30px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  #home-view:not(.hidden) {
    animation: slideIn 0.35s ease forwards;
  }

  #lesson-view.active {
    animation: slideIn 0.35s ease forwards;
  }

  .back-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:none;
  border:none;
  color: var(--gold);
  font-family:'Manrope';
  font-size: 15px;
  font-weight: 700;
  padding: 8px 0;
  margin-bottom: 10px;
  cursor:pointer;
  transition: opacity 0.2s ease;
}
.back-btn:active {
  opacity: 0.6;
}
  .lesson-eyebrow{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--violet);
    font-weight: 700;
  }
  .lesson-view h2{
    font-size: 20px;
    margin: 6px 0 14px;
    color: var(--parchment);
  }
  .lesson-body p{
    font-size: 15px;
    line-height: 1.6;
    color: var(--parchment);
    margin: 0 0 14px;
  }
  .lesson-img{
    width: 100%;
    border-radius: var(--radius);
    display: block;
    margin-bottom: 16px;
    border: 1px solid rgba(201,161,92,0.18);
    background: rgba(255,255,255,0.03);
  }
  .tip-box{
    background: rgba(139,111,201,0.12);
    border-left: 3px solid var(--violet);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--parchment);
    margin: 16px 0;
  }
  .tip-box b{ color: var(--violet); }

  /* ---------- Quiz ---------- */
  .quiz{
    margin-top: 22px;
    background: var(--bg-elevated);
    border-radius: var(--radius);
    padding: 16px;
    border: 1px solid rgba(201,161,92,0.15);
  }
  .quiz-q{
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--parchment);
  }
  .quiz-opt{
    display:block;
    width:100%;
    text-align:left;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--parchment);
    font-family:'Manrope';
    font-size: 13.5px;
    padding: 11px 14px;
    border-radius: 10px;
    margin-bottom: 8px;
    cursor:pointer;
  }
  .quiz-opt.correct{
    border-color: var(--success);
    background: rgba(111,169,122,0.15);
  }
  .quiz-opt.wrong{
    border-color: var(--danger);
    background: rgba(201,96,92,0.15);
  }
  .quiz-feedback{
    font-size: 13px;
    margin-top: 8px;
    color: var(--parchment-dim);
    display:none;
  }
  .quiz-feedback.show{ display:block; }

  .primary-btn{
    width:100%;
    background: linear-gradient(135deg, var(--gold), var(--gold-dim));
    color: #1A1508;
    font-family:'Manrope';
    font-weight: 800;
    font-size: 15px;
    border:none;
    border-radius: 12px;
    padding: 14px;
    margin-top: 20px;
    cursor:pointer;
    display:none;
  }
  .primary-btn.show{ display:block; }
  .primary-btn:active{ transform: scale(0.98); }

  /* ---------- Completion ---------- */
  .completion{
    text-align:center;
    padding: 40px 10px;
    display:none;
  }
  .completion.show{ display:block; }
  .completion .badge{
    font-size: 48px;
    margin-bottom: 12px;
  }
  .completion .badge.premium-glow{
    text-shadow: 0 0 18px rgba(201,161,92,0.7), 0 0 36px rgba(201,161,92,0.35);
  }
  .completion .insider-tag{
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--gold);
    border: 1px solid rgba(201,161,92,0.4);
    background: rgba(201,161,92,0.1);
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
  }

  /* ===== ПРЕМИУМ ===== */
  .premium-btn{
    display: block;
    width: 100%;
    text-align: center;
    background: none;
    border: none;
    color: var(--gold);
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 13px;
    padding: 12px 0 4px;
    cursor: pointer;
    opacity: 0.95;
  }
  .premium-btn:active{ opacity: 1; transform: scale(0.98); }
  .premium-intro{
    background: linear-gradient(135deg, rgba(201,161,92,0.14), rgba(201,161,92,0.04));
    border: 1px solid rgba(201,161,92,0.3);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 18px;
  }
  .premium-intro h2{
    font-family:'Cinzel', serif;
    color: var(--gold);
    font-size: 18px;
    margin: 0 0 8px;
  }
  .premium-intro p{
    font-size: 13.5px;
    color: var(--parchment-dim);
    line-height: 1.5;
    margin: 0 0 10px;
  }
  .premium-intro ul{ list-style:none; padding:0; margin: 10px 0; }
  .premium-intro li{ font-size: 13.5px; color: var(--parchment); padding: 4px 0; }
  .premium-intro li::before{ content: '✓ '; color: var(--success); font-weight: 700; }
  .premium-tile{
    display:flex;
    align-items:center;
    gap: 14px;
    background: var(--bg-elevated);
    border: 1px solid rgba(201,161,92,0.25);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor:pointer;
  }
  .premium-tile:active{ transform: scale(0.98); }
  .premium-tile-lock{ margin-left:auto; font-size: 16px; opacity: 0.7; }
  .tier-card{
    background: var(--bg-elevated);
    border: 1px solid rgba(201,161,92,0.25);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
  }
  .tier-name{
    font-family:'Cinzel', serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--gold);
  }
  .tier-price{
    font-size: 22px;
    font-weight: 800;
    color: var(--parchment);
    margin: 6px 0 10px;
  }
  .tier-perks{ list-style: none; padding: 0; margin: 0 0 14px; }
  .tier-perks li{ font-size: 13.5px; color: var(--parchment-dim); padding: 4px 0; }
  .tier-perks li::before{ content: '✓ '; color: var(--success); font-weight: 700; }
  .tier-perks-featured{ margin-bottom: 6px; }
  .tier-perks-featured li{
    font-size: 14.5px;
    font-weight: 700;
    color: var(--parchment);
  }
  .tier-perks-featured li::before{ content: '🔓 '; color: var(--gold); }
  .tier-bonus-label{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--parchment-dim);
    margin: 4px 0 6px;
    opacity: 0.8;
  }
  .tier-cancel-note{
    font-size: 11.5px;
    color: var(--parchment-dim);
    text-align: center;
    margin-top: 10px;
    opacity: 0.75;
  }
  .no-stars-help{
    margin: 18px 4px 4px;
    border: 1px solid rgba(201,161,92,0.25);
    border-radius: 12px;
    padding: 2px 14px;
    background: rgba(255,255,255,0.02);
  }
  .no-stars-help summary{
    cursor: pointer;
    padding: 12px 0;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--gold);
    list-style: none;
  }
  .no-stars-help summary::-webkit-details-marker{ display: none; }
  .no-stars-help summary::before{
    content: '⭐️⭐️⭐️ ';
  }
  .no-stars-body{
    font-size: 13px;
    line-height: 1.5;
    color: var(--parchment-dim);
    padding-bottom: 14px;
  }
  .no-stars-body ul{
    margin: 8px 0 0;
    padding-left: 20px;
  }
  .no-stars-body li{
    margin-bottom: 6px;
  }
  .tier-buy-btn{
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dim));
    color: #1A1508;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-family: 'Manrope', sans-serif;
    font-size: 14.5px;
  }
  .tier-buy-btn:disabled{ opacity: 0.6; cursor: default; }
  .premium-badge{
    display:inline-block;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    color: #1A1508;
    background: var(--gold);
    padding: 3px 9px;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  .lock-screen{
    text-align:center;
    padding: 40px 20px;
  }
  .lock-screen .lock-icon{ font-size: 40px; margin-bottom: 14px; }
  .calc-skills{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 14px 0;
  }
  .calc-skill-chip{
    display:flex;
    align-items:center;
    gap: 6px;
    background: rgba(201,161,92,0.08);
    border: 1px solid rgba(201,161,92,0.2);
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 13px;
    color: var(--parchment);
    cursor: pointer;
    font-family: 'Manrope', sans-serif;
  }
  .calc-skill-chip.selected{
    background: rgba(201,161,92,0.28);
    border-color: var(--gold);
    color: var(--gold);
    font-weight: 700;
  }
  .calc-result-box{
    background: var(--bg-elevated);
    border: 1px solid rgba(111,169,122,0.35);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-top: 10px;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--parchment-dim);
  }
  .calc-result-box.empty{
    border-color: rgba(255,255,255,0.08);
    color: var(--parchment-dim);
    opacity: 0.7;
  }
  .calc-cat-group{ margin-bottom: 4px; }
  .calc-cat-label{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    color: var(--gold);
    margin: 12px 0 6px;
  }
  .calc-stats-box{ margin: 6px 0 4px; }
  .calc-stats-title{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    color: var(--parchment-dim);
    margin-bottom: 10px;
  }
  .calc-stat-row{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .calc-stat-label{
    font-size: 12.5px;
    color: var(--parchment);
    width: 110px;
    flex-shrink: 0;
  }
  .calc-stat-track{
    flex: 1;
    height: 8px;
    background: rgba(255,255,255,0.06);
    border-radius: 6px;
    overflow: hidden;
  }
  .calc-stat-fill{
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    border-radius: 6px;
    transition: width 0.4s ease;
  }
  .calc-counter-box{
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }

<script>
let tg = null;
try {
  tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#14121F');
    tg.setBackgroundColor('#14121F');
    // Запрещаем закрытие мини-аппа свайпом вниз при скролле —
    // выйти можно только через стандартную кнопку "Закрыть".
    try {
      if (typeof tg.disableVerticalSwipes === 'function') {
        tg.disableVerticalSwipes();
      }
    } catch (e) {}
    // На случай если Telegram-клиент всё же попытается закрыть окно
    // (например, старый клиент без disableVerticalSwipes) — спросить подтверждение.
    try {
      if (typeof tg.enableClosingConfirmation === 'function') {
        tg.enableClosingConfirmation();
      }
    } catch (e) {}
  }
} catch (e) {
  console.error('Telegram WebApp init failed, continuing without it:', e);
  tg = null;
}

// ===== ГЛОБАЛЬНЫЙ ТАКТИЛЬНЫЙ ОТКЛИК (HAPTIC) =====
// Срабатывает на любое нажатие кнопки, темы, урока, пункта меню — на всех экранах.
function haptic(style) {
  try {
    if (tg && tg.HapticFeedback) {
      tg.HapticFeedback.impactOccurred(style || 'light');
    }
  } catch (e) {}
}
document.addEventListener('click', function(e) {
  const el = e.target.closest(
    'button, [onclick], .lesson-item, .topic-item, .sandbox-btn-tile, ' +
    '.sb-scenario-card, .premium-tile, .lang-btn, .lock-screen button, a'
  );
  if (el) haptic('light');
}, true);
// ===================================================

// ---------- Storage ----------
function cloudStorageAvailable() {
  try {
    if (!tg || !tg.CloudStorage) return false;
    if (typeof tg.isVersionAtLeast === 'function') {
      return tg.isVersionAtLeast('6.9');
    }
    return true;
  } catch (e) {
    return false;
  }
}

function withTimeout(promise, ms, fallbackValue) {
  return Promise.race([
    promise,
    new Promise((resolve) => setTimeout(() => resolve(fallbackValue), ms))
  ]);
}

const Storage = {
  async get(key) {
    if (!cloudStorageAvailable()) {
      return localStorage.getItem(key);
    }
    const cloudPromise = new Promise((resolve) => {
      try {
        tg.CloudStorage.getItem(key, (err, value) => resolve(err ? null : value));
      } catch (e) {
        resolve(localStorage.getItem(key));
      }
    });
    return withTimeout(cloudPromise, 1200, localStorage.getItem(key));
  },
  async set(key, value) {
    if (!cloudStorageAvailable()) {
      localStorage.setItem(key, value);
      return;
    }
    const cloudPromise = new Promise((resolve) => {
      try {
        tg.CloudStorage.setItem(key, value, () => resolve());
      } catch (e) {
        localStorage.setItem(key, value);
        resolve();
      }
    });
    await withTimeout(cloudPromise, 1200, null);
    localStorage.setItem(key, value);
  }
};

// ---------- Гостевой ID ----------
// Постоянный идентификатор устройства/сессии на случай, если tg.initData
// пуст (открыли вне Telegram / initData не пришёл) — чтобы у сообщения
// из обратной связи всё равно был хоть какой-то id отправителя.
let guestId = null;

function generateGuestId() {
  try {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      return window.crypto.randomUUID();
    }
  } catch (e) {}
  // Фолбэк для старых WebView без crypto.randomUUID
  return 'guest-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

async function ensureGuestId() {
  try {
    let id = await Storage.get('guest_id');
    if (!id) {
      id = generateGuestId();
      await Storage.set('guest_id', id);
    }
    guestId = id;
  } catch (e) {
    guestId = generateGuestId();
  }
  return guestId;
}

function updateProgress() {
  let totalLessons = 0;
  let completedLessons = 0;
  TOPICS.forEach(topic => {
    topic.lessons.forEach(lesson => {
      totalLessons++;
      if (completed.has(lesson.id)) completedLessons++;
    });
  });
  const percent = totalLessons === 0 ? 0 : Math.round((completedLessons / totalLessons) * 100);
  const percentEl = document.getElementById('progress-percent');
  const barEl = document.getElementById('progress-bar');
  if (percentEl) percentEl.textContent = percent + '%';
  if (barEl) barEl.style.width = percent + '%';
}

 async function countFirstVisit() {
  try {
    // Проверяем, не считали ли уже этого пользователя
    const alreadyCounted = await Storage.get('visit_counted');
    if (alreadyCounted) return;

    // Отправляем запрос на увеличение счётчика
    const res = await fetch(`https://countapi.mileshilliard.com/api/v1/hit/${VISIT_COUNTER_KEY}`);
    if (!res.ok) throw new Error('CountAPI hit failed: ' + res.status);

    // Помечаем, что для этого устройства счёт уже учтён
    // (только после успешного ответа — иначе при сбое сервера
    // визит "терялся" бы навсегда, потому что флаг уже стоит)
    await Storage.set('visit_counted', '1');
  } catch (e) {
    // Если счётчик недоступен, просто игнорируем ошибку — бот продолжит работать
    console.error('Visit counter failed:', e);
  }
}

  { id: 'luck', icon: '🍀', cat: 'leadership', arch: 'combat', ru: 'Удача', en: 'Luck', desc: { ru: 'Герой получает +1 к удаче.', en: 'The hero gains +1 Luck.' } },

  { id: 'righteousness', icon: '😇', cat: 'faction', arch: 'combat', ru: 'Праведность', en: 'Righteousness', desc: { ru: 'Когда дружественный отряд убивает противника или погибает, атака, защита, сила магии и знания героя растут на 1 на раунд (эффект суммируется).', en: 'When a friendly stack kills an enemy or dies, the hero\'s Attack, Defense, Spell Power and Knowledge rise by 1 for the round (stacks).' } },

const SYNERGY_PAIRS = {
  'offense|defense': { ru: 'Классическое «бей и держи удар»: Наступление повышает урон, Оборона снижает входящий урон. Хорошо для затяжных сражений.', en: 'A classic "hit and hold": Offense raises damage, Defense lowers incoming damage. Works well for drawn-out fights.' },
  'offense|battle-magic': { ru: 'Наступление усиливает урон юнитов, Боевая магия — урон заклинаний. Вместе герой угрожает и атакой, и заклинаниями — универсальный силовой билд.', en: 'Offense boosts unit damage, Battle Magic boosts spell damage. Together the hero threatens with both attacks and spells — a versatile might build.' },
  'offense|nightshade-magic': { ru: 'Наступление увеличивает урон атак, Магия теней ослабляет цель перед ударом — усиленная атака по уже ослабленному противнику.', en: 'Offense boosts attack damage, Nightshade Magic weakens the target beforehand — a heavier hit on an already-weakened enemy.' },
  'offense|logistics': { ru: 'Наступление даёт урон, Логистика — мобильность. Подходит агрессивному герою, который хочет навязать бой первым.', en: 'Offense gives damage, Logistics gives mobility. Fits an aggressive hero who wants to force an early fight.' },
  'offense|scouting': { ru: 'Наступление даёт силу в бою, Разведка — обзор карты для поиска целей. Подходит герою, который ищет добычу первым.', en: 'Offense gives combat power, Scouting extends visibility to spot targets first. Fits a hero hunting for easy kills early.' },
  'offense|diplomacy': { ru: 'Наступление — для сложных боёв, Дипломатия — чтобы не тратить силы на лёгкие цели, забирая их без боя. Экономит армию для важных сражений.', en: 'Offense for hard fights, Diplomacy avoids wasting strength on easy targets by recruiting them without a fight. Saves the army for battles that matter.' },
  'offense|economy': { ru: 'Наступление растит силу армии, Экономика ускоряет найм новых войск. Билд на постоянное давление за счёт пополнения.', en: 'Offense grows army strength, Economy speeds up hiring new troops. A build for constant pressure through steady reinforcement.' },
  'defense|battle-magic': { ru: 'Оборона снижает физический урон, Боевая магия добавляет урон заклинаниями. Хорошо для героя, который любит магию, но должен пережить ответку.', en: 'Defense reduces physical damage, Battle Magic adds spell damage. Good for a hero who leans on magic but still needs to survive retaliation.' },
  'defense|nightshade-magic': { ru: 'Оборона снижает получаемый урон, Магия теней ослабляет угрозу заранее. Оборонительный маг, которого сложно пробить.', en: 'Defense reduces incoming damage, Nightshade Magic weakens the threat beforehand. A defensive mage who\'s hard to break through.' },
  'defense|logistics': { ru: 'Оборона бережёт армию в бою, Логистика бережёт время на карте. Подходит осторожному герою, который методично зачищает респ.', en: 'Defense protects the army in battle, Logistics saves time on the map. Fits a careful hero clearing the map methodically.' },
  'defense|scouting': { ru: 'Оборона снижает риск в бою, Разведка — риск неожиданных встреч. Билд для игрока, который не любит рисковать.', en: 'Defense lowers combat risk, Scouting lowers the risk of surprise encounters. A build for a risk-averse player.' },
  'defense|diplomacy': { ru: 'Оборона помогает в боях, которых нельзя избежать, Дипломатия — избежать тех, которых можно. Вместе — минимум потерь на респе.', en: 'Defense helps in fights you can\'t avoid, Diplomacy helps you avoid the ones you can. Together — minimal losses while clearing the map.' },
  'defense|economy': { ru: 'Оборона снижает потери, Экономика быстрее их восполняет. Устойчивый билд для затяжной игры.', en: 'Defense reduces losses, Economy replaces them faster. A resilient build for a long game.' },
  'battle-magic|nightshade-magic': { ru: 'Мощная связка для мага: Магия теней ослабляет противника, Боевая магия увеличивает урон по уже ослабленной цели.', en: 'Strong pairing for a magic hero: Nightshade Magic weakens the enemy, Battle Magic boosts damage against the weakened target.' },
  'battle-magic|logistics': { ru: 'Боевая магия даёт урон без риска для войск, Логистика быстро доставляет героя к целям. Мобильный маг, бьющий издалека по расписанию.', en: 'Battle Magic deals damage without risking troops, Logistics gets the hero to targets fast. A mobile mage striking from range, on schedule.' },
  'battle-magic|scouting': { ru: 'Боевая магия сильна против крупных целей, Разведка помогает находить их заранее. Билд на охоту за конкретными жирными банками.', en: 'Battle Magic is strong against big targets, Scouting helps find them in advance. A build for hunting specific high-value banks.' },
  'battle-magic|diplomacy': { ru: 'Боевая магия — для сложных боёв, Дипломатия разгружает от лёгких. Маг тратит ману только там, где она действительно нужна.', en: 'Battle Magic handles hard fights, Diplomacy clears the easy ones without a fight. The mage spends mana only where it truly matters.' },
  'battle-magic|economy': { ru: 'Боевая магия требует маны и золота на гильдию магов, Экономика ускоряет и то, и другое. Билд для героя, вкладывающегося в магическую инфраструктуру.', en: 'Battle Magic needs mana and gold for the mage guild, Economy speeds up both. A build investing heavily in magical infrastructure.' },
  'nightshade-magic|logistics': { ru: 'Магия теней ослабляет цель, Логистика быстро подводит армию, пока эффект действует. Тайминг решает всё.', en: 'Nightshade Magic weakens the target, Logistics gets the army there fast while the effect holds. Timing is everything.' },
  'nightshade-magic|scouting': { ru: 'Магия теней требует точного применения, Разведка даёт понимание, где и когда её использовать. Расчётливый, а не спонтанный маг.', en: 'Nightshade Magic needs precise use, Scouting tells you where and when to use it. A calculated mage, not a spontaneous one.' },
  'nightshade-magic|diplomacy': { ru: 'Магия теней ослабляет тех, с кем придётся драться, Дипломатия убирает тех, с кем драться не обязательно. Экономия ресурсов на респе.', en: 'Nightshade Magic weakens what you must fight, Diplomacy removes what you don\'t have to. Resource-efficient map clearing.' },
  'nightshade-magic|economy': { ru: 'Магия теней даёт преимущество в бою, Экономика ускоряет рост гильдии магов для новых заклинаний. Развивающийся контрольный маг.', en: 'Nightshade Magic gives a combat edge, Economy speeds up mage guild growth for new spells. A scaling control mage.' },
  'logistics|scouting': { ru: 'Логистика увеличивает дальность хода, Разведка расширяет обзор. Билд для быстрого фарма и разведки, особенно на Jebus Cross.', en: 'Logistics increases movement range, Scouting extends visibility. A build for fast farming and scouting, especially on Jebus Cross.' },
  'logistics|diplomacy': { ru: 'Логистика доставляет героя быстрее, Дипломатия ускоряет пополнение армии по пути без боя. Билд на скоростной сбор респа.', en: 'Logistics gets the hero there faster, Diplomacy speeds up recruiting along the way without fighting. A build for rapid map clearing.' },
  'logistics|economy': { ru: 'Логистика экономит время, Экономика — золото. Вместе герой быстрее и богаче соперника с самого старта.', en: 'Logistics saves time, Economy saves gold. Together the hero is faster and richer than the opponent from the start.' },
  'scouting|diplomacy': { ru: 'Разведка находит нейтральные отряды, Дипломатия присоединяет их без боя. Идеальная пара для мирного набора армии.', en: 'Scouting finds neutral stacks, Diplomacy recruits them without a fight. A perfect pair for peacefully building an army.' },
  'scouting|economy': { ru: 'Разведка находит ценные объекты, Экономика даёт золото на их освоение. Билд на полное использование респа.', en: 'Scouting finds valuable objects, Economy provides the gold to make use of them. A build for squeezing every drop out of the map.' },
  'diplomacy|economy': { ru: 'Дипломатия чаще присоединяет нейтралов без боя, Экономика ускоряет накопление золота на их найм. Быстрый рост армии почти без потерь.', en: 'Diplomacy recruits neutrals without a fight more often, Economy speeds up gold for hiring them. Fast, low-loss army growth.' },
  'necromancy|battle-magic': { ru: 'Некромантия наращивает армию нежити без золота, Боевая магия усиливает её атаку и защиту силой магии героя. Классика Некрополя — армия и герой растут вместе.', en: 'Necromancy grows the undead army for free, Battle Magic boosts its Attack and Defense from the hero\'s Spell Power. The classic Necropolis pairing — army and hero scale together.' },
  'necromancy|tactics': { ru: 'Некромантия даёт постоянный приток нежити, Тактика расширяет зону расстановки — свежих скелетов удобнее расставить в три ряда перед боем.', en: 'Necromancy keeps feeding in fresh undead, Tactics widens the deployment zone — easier to line up new skeletons before the fight starts.' },
  'necromancy|insight': { ru: 'Некромантия наращивает армию бесплатно, Проницательность ускоряет рост уровня героя — быстрее открываются продвинутые и экспертные уровни некромантии.', en: 'Necromancy grows the army for free, Insight speeds up hero leveling — faster access to Advanced and Expert Necromancy.' },
  'righteousness|offense': { ru: 'Праведность даёт герою характеристики за каждую смерть в бою, Наступление превращает выросшую силу магии в дополнительный урон существ. Билд снежным комом набирает мощь по ходу боя.', en: 'Righteousness grants stats for every death in battle, Offense converts the growing Spell Power into extra creature damage. A build that snowballs mid-fight.' },
  'righteousness|leadership': { ru: 'Праведность растёт от боевых потерь с обеих сторон, Лидерство держит боевой дух высоким, чтобы армия не дрогнула, пока эффект копится.', en: 'Righteousness grows from casualties on both sides, Leadership keeps Morale high so the army doesn\'t falter while the effect stacks.' },
  'righteousness|battle-magic': { ru: 'Праведность быстро поднимает силу магии героя в бою, Боевая магия сразу переводит этот рост в дополнительную атаку и защиту существ.', en: 'Righteousness quickly raises the hero\'s Spell Power mid-battle, Battle Magic immediately turns that growth into extra creature Attack and Defense.' },
  'summon-swarm|leadership': { ru: 'Призыв роя каждый раунд добавляет новый отряд личинок, Лидерство поднимает боевой дух — свежее пополнение реже промахивается и действует увереннее.', en: 'Summon Swarm adds a fresh larvae stack every round, Leadership raises Morale — the new arrivals act more reliably.' },
  'summon-swarm|tactics': { ru: 'Призыв роя добавляет новые отряды прямо в бою, Тактика даёт больше места, чтобы расставить их до столкновения с врагом.', en: 'Summon Swarm adds new stacks mid-battle, Tactics gives more room to position them before the enemy closes in.' },
  'summon-swarm|battlecraft': { ru: 'Призыв роя каждый раунд пополняет армию личинками, Боевой порядок поощряет держать строй в ожидании — время работает на растущий рой.', en: 'Summon Swarm reinforces the army with larvae every round, Battlecraft rewards holding position — time favors the growing swarm.' },
  'abyssal-communion|offense': { ru: 'Причастие к Бездне усиливает существ Раскола за каждую победу, Наступление добавляет урона поверх этого бонуса — снежный ком силы от игры на серии побед.', en: 'Abyssal Communion strengthens Schism creatures with every win, Offense adds damage on top of that bonus — a snowball built on a winning streak.' },
  'abyssal-communion|resistance': { ru: 'Причастие к Бездне усиливает армию Раскола на серии побед, Сопротивление снижает магический урон — легче не потерять серию из-за одного неудачного боя.', en: 'Abyssal Communion strengthens the Schism army on a win streak, Resistance lowers magic damage taken — easier not to break the streak on one bad fight.' },
  'abyssal-communion|scouting': { ru: 'Причастие к Бездне требует побеждать снова и снова, Разведка помогает быстрее находить следующую цель, пока бонус ещё не сгорел до утра.', en: 'Abyssal Communion demands repeated wins, Scouting helps find the next target faster before the bonus fades by morning.' },
  'triumvirates-strength|offense': { ru: 'Сила Триумвирата раз за раунд поднимает одну характеристику героя, Наступление стабильно усиливает урон существ вне зависимости от выбранной стойки.', en: 'Triumvirate\'s Strength boosts one hero attribute per round, Offense reliably adds creature damage regardless of the chosen stance.' },
  'triumvirates-strength|wisdom': { ru: 'Сила Триумвирата может усиливать силу магии героя через стойку Дракона, Мудрость расширяет выбор заклинаний, которые эта сила магии будет усиливать.', en: 'Triumvirate\'s Strength can boost the hero\'s Spell Power via Dragon Stance, Wisdom widens the spell pool that Spell Power then strengthens.' },
  'triumvirates-strength|tactics': { ru: 'Сила Триумвирата даёт гибкость в бою через смену стоек, Тактика добавляет гибкости в расстановке войск перед боем — билд, который подстраивается на каждом этапе.', en: 'Triumvirate\'s Strength gives in-battle flexibility via stance swaps, Tactics adds pre-battle deployment flexibility — a build that adapts at every stage.' },
  'murmuring|battle-magic': { ru: 'Шёпот стихий даёт заряды концентрации в начале боя, Боевая магия делает применение этих зарядов ощутимее за счёт силы магии героя.', en: 'Murmuring grants Focus charges at the start of battle, Battle Magic makes spending them hit harder thanks to the hero\'s Spell Power.' },
  'murmuring|primal-magic': { ru: 'Шёпот стихий даёт заряды концентрации, Первородная магия открывает мощные стихийные заклинания, которые этими зарядами удобно усиливать.', en: 'Murmuring grants Focus charges, Primal Magic unlocks powerful elemental spells that those charges are well suited to power up.' },
  'murmuring|logistics': { ru: 'Шёпот стихий силён с самого начала боя без разгона, Логистика быстрее доставляет героя туда, где эту мгновенную силу можно применить первым.', en: 'Murmuring is strong from the very start of a fight with no ramp-up, Logistics gets the hero there faster to use that instant power first.' },

// Общий (не кураторский) разбор пары навыков — строится из их реальных описаний с вики,
// используется только когда для пары нет вручную написанной синергии в SYNERGY_PAIRS.
function genericSynergyText(idA, idB) {
  const a = SKILLS.find(s => s.id === idA);
  const b = SKILLS.find(s => s.id === idB);
  if (!a || !b) return null;
  if (currentLang === 'ru') {
    return `${a.ru} (${a.desc.ru}) и ${b.ru} (${b.desc.ru}) не образуют широко известную «именную» связку, но ничто не мешает взять оба — герой получит сразу оба эффекта.`;
  }
  return `${a.en} (${a.desc.en}) and ${b.en} (${b.desc.en}) don't form a well-known "named" combo, but nothing stops you from taking both — the hero simply gets both effects.`;
}

function getSynergyText(skillIds) {
  if (skillIds.length < 2) return null;
  const results = [];
  for (let i = 0; i < skillIds.length; i++) {
    for (let j = i + 1; j < skillIds.length; j++) {
      const key1 = `${skillIds[i]}|${skillIds[j]}`;
      const key2 = `${skillIds[j]}|${skillIds[i]}`;
      const entry = SYNERGY_PAIRS[key1] || SYNERGY_PAIRS[key2];
      if (entry) {
        results.push(entry[currentLang]);
      } else {
        const fallback = genericSynergyText(skillIds[i], skillIds[j]);
        if (fallback) results.push(fallback);
      }
    }
  }
  return results;
}

function computeArchetype(skillIds) {
  if (skillIds.length === 0) return null;
  const cats = [...new Set(skillIds.map(id => SKILLS.find(s => s.id === id).arch))].sort();
  const key = cats.join('+');
  return ARCHETYPES[key] || null;
}

function computeCategoryFill(skillIds) {
  const fill = { combat: 0, magic: 0, mobility: 0, economy: 0 };
  skillIds.forEach(id => {
    const s = SKILLS.find(x => x.id === id);
    if (s) fill[s.arch] = Math.min(2, fill[s.arch] + 1);
  });
  return fill;
}

function computeSynergyScore(skillIds) {
  if (skillIds.length < 2) return null;
  let possible = 0, found = 0;
  for (let i = 0; i < skillIds.length; i++) {
    for (let j = i + 1; j < skillIds.length; j++) {
      possible++;
      const key1 = `${skillIds[i]}|${skillIds[j]}`;
      const key2 = `${skillIds[j]}|${skillIds[i]}`;
      if (SYNERGY_PAIRS[key1] || SYNERGY_PAIRS[key2]) found++;
    }
  }
  return { score: Math.round((found / possible) * 10), found, possible };
}

function openSandboxHub() {
  trackEvent('open_sandbox');
  document.getElementById('completion-view').classList.remove('show');
  document.getElementById('topics-view').classList.add('hidden');
  document.getElementById('premium-view').classList.add('hidden');
  document.getElementById('subscribe-view').classList.add('hidden');
  document.getElementById('premium-guide-view').classList.add('hidden');
  document.getElementById('premium-guides-hub-view').classList.add('hidden');
  document.getElementById('premium-calc-view').classList.add('hidden');
  document.getElementById('premium-battle-calc-view').classList.add('hidden');
  document.getElementById('sandbox-play-view').classList.add('hidden');
  document.getElementById('sandbox-hub-view').classList.remove('hidden');
  renderSandboxHub();
  if (isSubscribed === null) checkSubscription().then(renderSandboxHub);
  forceScrollTop();
}

function goSandboxHub() {
  document.getElementById('sandbox-play-view').classList.add('hidden');
  document.getElementById('sandbox-hub-view').classList.remove('hidden');
  renderSandboxHub();
  forceScrollTop();
}

function renderSandboxHub() {
  setText('sandbox-hub-eyebrow', t('sandboxHubEyebrow'));
  setText('sandbox-hub-title', t('sandboxHubTitle'));
  setText('sandbox-hub-intro', t('sandboxHubIntro'));
  setText('sandbox-hub-back-label', t('sandboxBackToHub'));

  const list = document.getElementById('sandbox-scenarios-list');
  list.innerHTML = '';
  SANDBOX_SCENARIOS.forEach((sc, i) => {
    const content = sc[currentLang];
    const done = sandboxCompleted.has(sc.id);
    const locked = !sc.free && !isSubscribed;
    const card = document.createElement('div');
    card.className = 'sb-scenario-card' + (done ? ' done' : '') + (locked ? ' locked' : '');
    card.onclick = () => (locked ? openSubscribe('sandbox') : openSandboxScenario(i));
    card.innerHTML = `
      <div class="sb-scenario-num">${done ? '✓' : (i + 1)}</div>
      <div style="flex:1;">
        <div class="lesson-title">${content.icon} ${content.title}</div>
        ${locked ? `<div class="sb-scenario-hint">${t('sandboxCardHint')}</div>` : ''}
      </div>
      ${locked ? '<div class="premium-tile-lock">🔒</div>' : ''}
    `;
    list.appendChild(card);
  });
}

function openSandboxScenario(index) {
  const sc = SANDBOX_SCENARIOS[index];
  if (!sc.free && !isSubscribed) { 
    openSubscribe('sandbox'); 
    return; 
  }

  currentSandboxIndex = index;
  document.getElementById('sandbox-hub-view').classList.add('hidden');
  document.getElementById('sandbox-play-view').classList.remove('hidden');
  setText('sandbox-play-back-label', t('sandboxBackToList'));
  renderSandboxScenario();
}

function renderSandboxScenario() {
  const sc = SANDBOX_SCENARIOS[currentSandboxIndex];
  const content = sc[currentLang];
  const body = document.getElementById('sandbox-play-body');
  const letters = currentLang === 'ru' ? ['А', 'Б', 'В', 'Г'] : ['A', 'B', 'C', 'D'];
  
  body.innerHTML = `
    <div class="eyebrow">${t('sandboxStepLabel', currentSandboxIndex + 1, SANDBOX_SCENARIOS.length)}</div>
    <h1>${content.icon} ${content.title}</h1>
    <div class="sb-situation-box">${content.situation}</div>
    <div class="sb-choose-label">${t('sandboxChooseLabel')}</div>
    <div id="sb-options"></div>
    <div class="sb-feedback" id="sb-feedback"></div>
    <div id="sb-next-wrap"></div>
  `;
  
  const optsWrap = document.getElementById('sb-options');
  content.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'sb-option-btn';
    btn.innerHTML = `<span class="sb-option-letter">${letters[i]}</span> ${opt}`;
    btn.onclick = () => answerSandbox(i);
    optsWrap.appendChild(btn);
  });

  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  
  // Прокрутка наверх (двойной вызов — фикс бага "не поднимается с последней темы")
  forceScrollTop();
}

function answerSandbox(chosen) {
  const sc = SANDBOX_SCENARIOS[currentSandboxIndex];
  const content = sc[currentLang];
  const opts = document.querySelectorAll('#sb-options .sb-option-btn');
  const feedback = document.getElementById('sb-feedback');
  const nextWrap = document.getElementById('sb-next-wrap');
  
  const correctAnswer = content.correct;
  const isCorrect = (chosen === correctAnswer);

  opts.forEach((btn, i) => {
    btn.disabled = true;
    btn.onclick = null;
    
    if (i === correctAnswer) {
      btn.classList.add('sb-correct');
    }
    
    if (i === chosen && i !== correctAnswer) {
      btn.classList.add('sb-wrong');
    }
  });

  feedback.className = 'sb-feedback explain show';
  
  if (isCorrect) {
    feedback.textContent = '✅ ' + t('correctFeedback') + ' ' + content.explain;
  } else {
    feedback.textContent = '❌ ' + t('wrongFeedback') + ' ' + content.explain;
  }

  sandboxCompleted.add(sc.id);
  saveSandboxProgress();

  nextWrap.innerHTML = `<button class="sb-next-btn" onclick="sandboxGoNext()">${t('sandboxNext')}</button>`;
  setTimeout(() => {
    nextWrap.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }, 100);
}

function openLesson(index) {
  currentLessonIndex = index;
  const l = TOPICS[currentTopicIndex].lessons[index];
  const content = l[currentLang];
  
  // Перемешиваем вопросы
  const shuffledQuizzes = content.quizzes.map(quiz => {
    const shuffled = shuffleQuizOptions(quiz);
    return {
      q: quiz.q,
      options: shuffled.options,
      correct: shuffled.correct
    };
  });
  
  quizAnswered = new Array(shuffledQuizzes.length).fill(false);

  document.getElementById('home-view').classList.add('hidden');
  document.getElementById('lesson-view').classList.add('active');

  setText('back-btn-label', t('backBtn'));
  setText('lv-eyebrow', content.eyebrow);
  setText('lv-title', content.title);

  const body = document.getElementById('lv-body');
  const imageHtml = l.image
    ? `<img src="${l.image}" class="lesson-img" alt="${content.title}" loading="lazy" onerror="this.style.display='none'">`
    : '';
  body.innerHTML = imageHtml + content.body.map(p => `<p>${p}</p>`).join('') +
    `<div class="tip-box"><b>${t('tipLabel')}</b> ${content.tip}</div>`;

  const quizContainer = document.getElementById('lv-quiz');
  quizContainer.innerHTML = '';
  document.getElementById('complete-btn').className = 'primary-btn';
  setText('complete-btn', t('completeBtn'));

  shuffledQuizzes.forEach((quiz, qIndex) => {
    const block = document.createElement('div');
    block.className = 'quiz';
    block.style.marginTop = qIndex === 0 ? '22px' : '14px';
    block.innerHTML = `
      <div class="quiz-q">${qIndex + 1}. ${quiz.q}</div>
      <div class="quiz-opts-${qIndex}"></div>
      <div class="quiz-feedback" id="quiz-feedback-${qIndex}"></div>
    `;
    quizContainer.appendChild(block);

    const optsWrap = block.querySelector(`.quiz-opts-${qIndex}`);
    quiz.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'quiz-opt';
      btn.textContent = opt;
      btn.onclick = () => answerQuiz(qIndex, i, quiz.correct);
      optsWrap.appendChild(btn);
    });
  });

  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  forceScrollTop();
}

function answerQuiz(quizIndex, chosen, correct) {
  const block = document.querySelectorAll('#lv-quiz .quiz')[quizIndex];
  const opts = block.querySelectorAll('.quiz-opt');
  opts.forEach((btn, i) => {
    btn.onclick = null;
    if (i === correct) btn.classList.add('correct');
    else if (i === chosen) btn.classList.add('wrong');
  });
  const feedback = document.getElementById(`quiz-feedback-${quizIndex}`);
  feedback.textContent = chosen === correct ? t('correctFeedback') : t('wrongFeedback');
  feedback.classList.add('show');

  quizAnswered[quizIndex] = true;
  if (quizAnswered.every(Boolean)) {
    document.getElementById('complete-btn').classList.add('show');
  }

  if (tg && tg.HapticFeedback) {
    tg.HapticFeedback.notificationOccurred(chosen === correct ? 'success' : 'error');
  }
}

function firstIncompleteIndex() {
  const lessons = TOPICS[currentTopicIndex].lessons;
  for (let i = 0; i < lessons.length; i++) {
    if (!completed.has(lessons[i].id)) return i;
  }
  return lessons.length - 1;
}

// Функция для перемешивания вариантов ответов
function shuffleQuizOptions(quiz) {
  const indices = [0, 1, 2];
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  
  const correctAnswer = quiz.options[quiz.correct];
  const shuffledOptions = indices.map(i => quiz.options[i]);
  const newCorrectIndex = shuffledOptions.indexOf(correctAnswer);
  
  return {
    options: shuffledOptions,
    correct: newCorrectIndex
  };
}




// ---------- ПРЕМИУМ ----------
async function checkSubscription() {
  if (PREVIEW_MODE_UNLOCK_ALL) { isSubscribed = true; return true; }
  if (!tg || !tg.initData) { isSubscribed = false; return false; }
  try {
    // Таймаут на случай, если Worker/сеть отвечают медленно — иначе экран
    // мог зависнуть в ожидании без ограничения по времени. При таймауте
    // трактуем как "не подписан" (безопасный дефолт — не откроем платный
    // контент по ошибке); при следующей проверке статус переопределится.
    const fetchPromise = fetch(`${WORKER_URL}/check-subscription?initData=${encodeURIComponent(tg.initData)}`)
      .then(res => res.json());
    const data = await withTimeout(fetchPromise, 6000, null);
    isSubscribed = !!(data && data.ok && data.subscribed);
  } catch (e) {
    isSubscribed = false;
  }
  return isSubscribed;
}

        `<button class="card-btn open" onclick="event.stopPropagation(); openPremiumGuide('${guide.id}');">${currentLang === 'ru' ? 'Открыть →' : 'Open →'}</button>`
      }
    `;
    list.appendChild(el);
  });
}

function loadBuild(skillIds) {
  selectedSkills = skillIds.slice(0, 3);
  renderCalcSkills();
  renderCalcOutput();
  setTimeout(() => {
    const resultBox = document.getElementById('calc-result-box');
    if (resultBox) resultBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 100);
}

function renderCalcSkills() {
  const wrap = document.getElementById('calc-skills-groups');
  wrap.innerHTML = '';
  ['combat', 'magic', 'economy', 'leadership', 'faction'].forEach(catId => {
    const cat = SKILL_CATEGORIES[catId];
    const group = document.createElement('div');
    group.className = 'calc-cat-group';
    group.innerHTML = `<div class="calc-cat-label">${cat.icon} ${cat[currentLang]}</div>`;
    const chipsRow = document.createElement('div');
    chipsRow.className = 'calc-skills';
    SKILLS.filter(s => s.cat === catId).forEach(skill => {
      const chip = document.createElement('div');
      chip.className = 'calc-skill-chip' + (selectedSkills.includes(skill.id) ? ' selected' : '');
      chip.title = skill.desc ? skill.desc[currentLang] : '';
      chip.innerHTML = `${skill.icon} ${skill[currentLang]}`;
      chip.onclick = () => toggleSkillChip(skill.id);
      chipsRow.appendChild(chip);
    });
    group.appendChild(chipsRow);
    wrap.appendChild(group);
  });
}

function toggleSkillChip(skillId) {
  const i = selectedSkills.indexOf(skillId);
  if (i >= 0) {
    selectedSkills.splice(i, 1);
  } else {
    if (selectedSkills.length >= 3) selectedSkills.shift();
    selectedSkills.push(skillId);
  }
  renderCalcSkills();
  renderCalcOutput();
}

function renderCalcOutput() {
  const statsBox = document.getElementById('calc-stats-box');
  if (selectedSkills.length === 0) {
    statsBox.innerHTML = '';
  } else {
    const fill = computeCategoryFill(selectedSkills);
    statsBox.innerHTML = `
      <div class="calc-stats-title">${t('calcStatsTitle')}</div>
      ${['combat', 'magic', 'mobility', 'economy'].map(catId => {
        const cat = ARCH_CATEGORIES[catId];
        const pct = (fill[catId] / 2) * 100;
        return `
          <div class="calc-stat-row">
            <div class="calc-stat-label">${cat.icon} ${cat[currentLang]}</div>
            <div class="calc-stat-track"><div class="calc-stat-fill" style="width:${pct}%"></div></div>
          </div>
        `;
      }).join('')}
    `;
  }

  const archetypeBox = document.getElementById('calc-archetype-box');
  const archetype = computeArchetype(selectedSkills);
  const synergy = computeSynergyScore(selectedSkills);
  
  if (archetype) {
    const content = archetype[currentLang];
    archetypeBox.innerHTML = `
      <div class="tier-card" style="margin: 14px 0;">
        <div style="font-size:26px; margin-bottom:6px;">${archetype.icon}</div>
        <div class="tier-name">${content.title}</div>
        <p style="font-size:13.5px; color:var(--parchment-dim); margin:8px 0 0;">${content.desc}</p>
        <p style="font-size:12.5px; color:var(--gold); margin:10px 0 0;">${t('calcTemplateHint')}: ${archetype.template}</p>
        <div class="calc-counter-box">
          <div class="calc-counter-label">${t('calcCounterLabel')}</div>
          <p style="font-size:13px; color:var(--parchment-dim); margin:4px 0 0;">${content.counter}</p>
        </div>
      </div>
    `;
  } else {
    archetypeBox.innerHTML = '';
  }

  let synergyHTML = '';
  if (synergy) {
    const scorePercent = synergy.score * 10;
    const color = synergy.score > 7 ? 'var(--success)' : 'var(--gold)';
    synergyHTML = `
      <div class="synergy-meter" style="margin: 14px 0;">
        <div style="display: flex; justify-content: space-between; font-size: 13px; color: var(--parchment-dim);">
          <span>${t('calcSynergyScore')}</span>
          <span>${synergy.score}/10</span>
        </div>
        <div style="width: 100%; height: 8px; background: rgba(255,255,255,0.08); border-radius: 6px; overflow: hidden; margin-top: 4px;">
          <div style="width: ${scorePercent}%; height: 100%; background: ${color}; border-radius: 6px; transition: width 0.5s ease;"></div>
        </div>
      </div>
    `;
  }

  const tipKeys = [...new Set(selectedSkills.filter(id => SUBSKILL_TIPS[id]))];
  const tipsHtml = tipKeys.map(id => `<div class="calc-subtip">💡 ${SUBSKILL_TIPS[id][currentLang]}</div>`).join('');

  const box = document.getElementById('calc-result-box');
  const results = getSynergyText(selectedSkills);
  const bodyHtml = (results && results.length > 0) ? results.map(r => `<p>${r}</p>`).join('') : '';

  if (!bodyHtml && !tipsHtml && !synergyHTML) {
    box.className = 'calc-result-box empty';
    box.textContent = t('calcEmpty');
  } else {
    box.className = 'calc-result-box';
    box.innerHTML = (bodyHtml ? `<div class="calc-result-heading">${t('calcPairsTitle')}</div>${bodyHtml}` : '') + tipsHtml + synergyHTML;
  }
}

// ---------- Боевые калькуляторы (Некромантия / Защита) ----------
// Данные проверены по официальной базе юнитов (olden-era.com/units) и гайдам по фракции на 13.08.2026.
// Механика: некромантия поднимает % от суммарного HP уничтоженных живых юнитов, распределяя
// полученный "пул HP" поровну между уже существующими в армии стеками нежити.
const NECRO_BASE_PERCENT = { basic: 4, advanced: 6, expert: 8 };
const NECRO_UNITS = [
  { level: 1, hp: 6,   ru: 'Скелет',          en: 'Skeleton',      icon: '💀' },
  { level: 2, hp: 8,   ru: 'Вайт',            en: 'Wight',         icon: '👻' },
  { level: 3, hp: 14,  ru: 'Нежить-питомец',  en: 'Undead Pet',    icon: '🐾' },
  { level: 4, hp: 30,  ru: 'Грабитель могил', en: 'Graverobber',   icon: '⚰️' },
  { level: 5, hp: 45,  ru: 'Лич',             en: 'Lich',          icon: '🧙' },
  { level: 6, hp: 80,  ru: 'Жуткий рыцарь',   en: 'Dread Knight',  icon: '🗡️' },
  { level: 7, hp: 150, ru: 'Вампир',          en: 'Vampire',       icon: '🧛' }
];

let battleCalcTab = 'necro';
let necroSkillLevel = 'basic';
let necroModPowerOfDead = false;   // поднавык «Повелитель мертвых» +2%
let necroModAnimateDeadLaw = false; // закон Animate Dead I +2%
let necroExtraPercent = 0;          // прочие бонусы (специализация героя и т.д.)
let necroTotalHP = 0;               // суммарный HP уничтоженных живых юнитов
let necroActiveStacks = new Set();  // какие тиры нежити уже есть в армии
let defenseAtk = 0;
let defenseDef = 0;

async function openBattleCalc() {

// ---------- Вкладка: Некромантия ----------
function renderNecroCalc() {
  const content = document.getElementById('battle-calc-content');
  const skillNames = t('necroSkillNames');
  content.innerHTML = `
    <div class="calc-disclaimer">${t('necroDisclaimer')}</div>

    <div class="calc-cat-label">${t('necroSkillLabel')}</div>
    <div class="necro-skill-select">
      ${['basic', 'advanced', 'expert'].map(lvl => `
        <div class="necro-skill-btn ${necroSkillLevel === lvl ? 'selected' : ''}" onclick="setNecroSkill('${lvl}')">
          ${skillNames[lvl]}<br><span style="opacity:0.7;">${NECRO_BASE_PERCENT[lvl]}%</span>
        </div>
      `).join('')}
    </div>

    <div class="calc-cat-label">${t('necroHpLabel')}</div>
    <input type="number" min="0" class="calc-input-full" id="necro-hp-input" value="${necroTotalHP}" oninput="setNecroHP(this.value)" placeholder="${t('necroHpPlaceholder')}" />

    <div class="calc-cat-label">${t('necroModsLabel')}</div>
    <div class="calc-skills">
      <div class="calc-skill-chip ${necroModPowerOfDead ? 'selected' : ''}" onclick="toggleNecroMod('power')">${t('necroModPowerOfDead')} (+2%)</div>
      <div class="calc-skill-chip ${necroModAnimateDeadLaw ? 'selected' : ''}" onclick="toggleNecroMod('law')">${t('necroModAnimateDeadLaw')} (+2%)</div>
    </div>
    <div style="margin: 8px 0 4px; font-size:12.5px; color:var(--parchment-dim);">${t('necroExtraLabel')}</div>
    <input type="number" min="0" class="calc-input-full" style="margin-top:4px;" id="necro-extra-input" value="${necroExtraPercent}" oninput="setNecroExtra(this.value)" />

    <div class="calc-cat-label">${t('necroStacksLabel')}</div>
    <div class="calc-skills">
      ${NECRO_UNITS.map(u => `
        <div class="calc-skill-chip ${necroActiveStacks.has(u.level) ? 'selected' : ''}" onclick="toggleNecroStack(${u.level})">${u.icon} ${u[currentLang]}</div>
      `).join('')}
    </div>

    <div class="calc-result-box" id="necro-result-box"></div>
  `;
  renderNecroResult();
}

function setNecroSkill(lvl) {
  necroSkillLevel = lvl;
  renderNecroCalc();
}

function setNecroHP(value) {
  let n = parseInt(value, 10);
  if (isNaN(n) || n < 0) n = 0;
  necroTotalHP = n;
  renderNecroResult();
}

function setNecroExtra(value) {
  let n = parseInt(value, 10);
  if (isNaN(n) || n < 0) n = 0;
  necroExtraPercent = n;
  renderNecroResult();
}

function toggleNecroMod(mod) {
  if (mod === 'power') necroModPowerOfDead = !necroModPowerOfDead;
  if (mod === 'law') necroModAnimateDeadLaw = !necroModAnimateDeadLaw;
  renderNecroCalc();
}

function toggleNecroStack(level) {
  if (necroActiveStacks.has(level)) {
    necroActiveStacks.delete(level);
  } else {
    necroActiveStacks.add(level);
  }
  renderNecroCalc();
}

function renderNecroResult() {
  const box = document.getElementById('necro-result-box');
  if (!box) return;

  if (necroTotalHP <= 0) {
    box.className = 'calc-result-box empty';
    box.textContent = t('necroEmpty');
    return;
  }

  let totalPercent = NECRO_BASE_PERCENT[necroSkillLevel];
  if (necroModPowerOfDead) totalPercent += 2;
  if (necroModAnimateDeadLaw) totalPercent += 2;
  totalPercent += necroExtraPercent;

  const raisedPool = necroTotalHP * (totalPercent / 100);

  if (necroActiveStacks.size === 0) {
    box.className = 'calc-result-box';
    box.innerHTML = `
      <div class="necro-summary-row">
        <span>${t('necroTotalPercent')}</span><span class="val">${totalPercent}%</span>
      </div>
      <div class="necro-summary-row">
        <span>${t('necroRaisedPool')}</span><span class="val">${raisedPool.toFixed(1)} HP</span>
      </div>
      <div class="calc-subtip" style="margin-top:10px;">${t('necroNoStacksWarning')}</div>
    `;
    return;
  }

  const stacks = Array.from(necroActiveStacks).sort((a, b) => a - b);
  const hpPerStack = raisedPool / stacks.length;

  const rows = stacks.map(level => {
    const u = NECRO_UNITS.find(x => x.level === level);
    const units = Math.floor(hpPerStack / u.hp);
    const leftoverHp = (hpPerStack - units * u.hp).toFixed(1);
    return `<div class="necro-summary-row"><span>${u.icon} ${u[currentLang]}</span><span class="val ${units > 0 ? 'positive' : ''}">+${units} (${leftoverHp} HP ${t('necroLeftover')})</span></div>`;
  }).join('');

  box.className = 'calc-result-box';
  box.innerHTML = `
    <div class="necro-summary-row">
      <span>${t('necroTotalPercent')}</span><span class="val">${totalPercent}%</span>
    </div>
    <div class="necro-summary-row">
      <span>${t('necroRaisedPool')}</span><span class="val">${raisedPool.toFixed(1)} HP</span>
    </div>
    <div class="necro-summary-row" style="margin-bottom:8px;">
      <span>${t('necroPerStack')}</span><span class="val">${hpPerStack.toFixed(1)} HP</span>
    </div>
    <div style="border-top:1px solid rgba(255,255,255,0.08); padding-top:8px;">
      ${rows}
    </div>
  `;
}

// ---------- Вкладка: Защита ----------
function renderDefenseCalc() {
  const content = document.getElementById('battle-calc-content');
  content.innerHTML = `
    <div class="calc-cat-label">${t('defenseAttackLabel')}</div>
    <input type="number" min="0" class="calc-input-full" id="defense-atk-input" value="${defenseAtk}" oninput="setDefenseAtk(this.value)" />
    <div class="calc-cat-label">${t('defenseDefenseLabel')}</div>
    <input type="number" min="0" class="calc-input-full" id="defense-def-input" value="${defenseDef}" oninput="setDefenseDef(this.value)" />
    <div class="calc-result-box" id="defense-result-box"></div>
  `;
  renderDefenseResult();
}

function setDefenseAtk(value) {
  let n = parseInt(value, 10);
  if (isNaN(n) || n < 0) n = 0;
  defenseAtk = n;
  renderDefenseResult();
}

function setDefenseDef(value) {
  let n = parseInt(value, 10);
  if (isNaN(n) || n < 0) n = 0;
  defenseDef = n;
  renderDefenseResult();
}

function renderDefenseResult() {
  const box = document.getElementById('defense-result-box');
  if (!box) return;

  const multiplier = (20 + defenseAtk) / (20 + defenseDef);
  const percent = (multiplier - 1) * 100;
  const percentRounded = Math.abs(percent).toFixed(1);

  let text;
  if (Math.abs(percent) < 0.05) {
    text = t('defenseEqualText');
  } else if (percent > 0) {
    text = t('defenseHigherText', percentRounded);
  } else {
    text = t('defenseLowerText', percentRounded);
  }

  box.className = 'calc-result-box';
  box.innerHTML = `
    <div class="defense-result-big">
      <div class="num">×${multiplier.toFixed(2)}</div>
      <div class="label">${t('defenseMultiplier')}</div>
    </div>
    <div class="necro-summary-row" style="margin-top:6px;">
      <span>${t('defenseChange')}</span>
      <span class="val ${percent > 0 ? 'positive' : (percent < 0 ? 'negative' : '')}">${percent >= 0 ? '+' : ''}${percent.toFixed(1)}%</span>
    </div>
    <p style="margin-top:10px;">${text}</p>
  `;
}

async function buyTier(tier) {
  const status = document.getElementById('subscribe-status');
  const btn = document.getElementById(`buy-btn-${tier}`);

  if (!tg || !tg.initData) {
    status.style.display = 'block';
    status.textContent = t('notInTelegram');
    return;
  }

  trackEvent('pay_click', tier);

  btn.disabled = true;
  btn.textContent = t('payingBtn');

  try {
    const res = await fetch(`${WORKER_URL}/create-invoice`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: tg.initData, tier })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'invoice_failed');

    tg.openInvoice(data.link, async (result) => {
      btn.disabled = false;
      btn.textContent = t('payBtn');
      if (result === 'paid') {
        status.style.display = 'block';
        status.textContent = t('paySuccess');
        await checkSubscription();
      } else if (result === 'cancelled') {
        status.style.display = 'block';
        status.textContent = t('payCancelled');
      }
    });
  } catch (e) {
    btn.disabled = false;
    btn.textContent = t('payBtn');
    status.style.display = 'block';
    status.textContent = t('payError');
  }
}

// ===== КНОПКА "НАВЕРХ" =====
const scrollBtn = document.getElementById('scrollTopBtn');

function updateScrollBtn() {
  const appEl = document.getElementById('app');
  const scrolled = appEl ? appEl.scrollTop : 0;
  if (scrolled > 300) {
    scrollBtn.classList.add('visible');
  } else {
    scrollBtn.classList.remove('visible');
  }
}

document.getElementById('app').addEventListener('scroll', updateScrollBtn, { passive: true });

// Пересчитываем видимость кнопки при любой смене экрана
// (важно для песочницы и коротких страниц, где scroll может не сработать сам)
const scrollBtnObserver = new MutationObserver(() => {
  requestAnimationFrame(updateScrollBtn);
});
scrollBtnObserver.observe(document.getElementById('app'), {
  attributes: true,
  attributeFilter: ['class'],
  subtree: true
});

// Двойной вызов надёжно перебивает "scroll anchoring" браузера,
// из-за которого страница иногда не долистывает наверх
// после смены DOM (баг: "не поднимается с последней темы").
// Используется и кнопкой "наверх", и всеми программными переходами
// (в т.ч. песочницей), где раньше стоял голый window.scrollTo(0,0).
function forceScrollTop() {
  const appEl = document.getElementById('app');
  if (appEl) appEl.scrollTop = 0;
  window.scrollTo(0, 0);
  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;
  requestAnimationFrame(() => {
    if (appEl) appEl.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

function scrollToTop() {
  forceScrollTop();
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
}

// Функция init
async function init() {
  // Эти 4 запроса ничего не читают друг у друга — раньше шли строго
  // последовательно (await за await), и в худшем случае (медленный
  // CloudStorage) это суммировалось до нескольких секунд ожидания перед
  // тем, как вообще открыть список тем. Теперь идут параллельно.
  const [, savedLang, saved, savedSandbox] = await Promise.all([
    ensureGuestId(),
    Storage.get('lang'),
    Storage.get('completed_lessons'),
    Storage.get('sandbox_completed')
  ]);

  if (saved) {
    try { completed = new Set(JSON.parse(saved)); } catch(e) {}
  }
  if (savedSandbox) {
    try { sandboxCompleted = new Set(JSON.parse(savedSandbox)); } catch(e) {}
  }

  // countFirstVisit зависит от guestId (уже готов после Promise.all выше),
  // сам по себе ни на что не блокирует дальнейшую отрисовку — не ждём его
  // здесь, чтобы не задерживать открытие приложения ради статистики визита.
  countFirstVisit();

  updateProgress();

  if (savedLang === 'ru' || savedLang === 'en') {
    currentLang = savedLang;
    document.getElementById('lang-view').classList.add('hidden');
    document.getElementById('topics-view').classList.remove('hidden');
    renderTopics();
  }
};

function answerPremiumQuiz(quizIndex, chosen, correct) {
  // Находим блок викторины по индексу
  const allQuizzes = document.querySelectorAll('#premium-guide-quiz .quiz');
  const block = allQuizzes[quizIndex];
  
  if (!block) {
    console.error('Блок викторины не найден для индекса:', quizIndex);
    return;
  }
  
  // Находим все варианты ответов в этом блоке
  const opts = block.querySelectorAll('.quiz-opt');
  
  // Подсвечиваем правильный и выбранный ответы
  opts.forEach((btn, i) => {
    btn.onclick = null; // Отключаем повторные клики
    if (i === correct) {
      btn.classList.add('correct'); // Правильный ответ - зеленый
    } else if (i === chosen && i !== correct) {
      btn.classList.add('wrong'); // Неправильный выбранный - красный
    }
  });
  
  // Показываем feedback
  const feedback = document.getElementById(`pquiz-feedback-${quizIndex}`);
  if (feedback) {
    if (chosen === correct) {
      feedback.textContent = '✅ ' + t('correctFeedback');
    } else {
      feedback.textContent = '❌ ' + t('wrongFeedback');
    }
    feedback.classList.add('show');
  }
}
