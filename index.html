<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Olden Era: С нуля / From Scratch</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14121F;
    --bg-elevated: #1D1A2E;
    --gold: #C9A15C;
    --gold-dim: #7A6538;
    --violet: #8B6FC9;
    --parchment: #EDE6D6;
    --parchment-dim: #A8A2B8;
    --danger: #C9605C;
    --success: #6FA97A;
    --radius: 14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; overflow-anchor: none;}
  body{
    background: radial-gradient(ellipse at top, #201C33 0%, var(--bg) 55%);
    color: var(--parchment);
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  h1,h2,h3, .display{
    font-family: 'Cinzel', serif;
    letter-spacing: 0.02em;
  }
  #app{
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 18px 40px;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* ---------- Language select screen ---------- */
  .lang-view{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height: 90vh;
    text-align:center;
  }
  .lang-view .badge{
    font-size: 40px;
    margin-bottom: 16px;
  }
  .lang-view h1{
    font-size: 24px;
    margin: 0 0 8px;
  }
  .lang-view p{
    color: var(--parchment-dim);
    font-size: 14px;
    margin: 0 0 28px;
  }
  .lang-options{
    display:flex;
    flex-direction:column;
    gap: 12px;
    width: 100%;
    max-width: 320px;
  }
  .lang-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    background: var(--bg-elevated);
    border: 1px solid rgba(201,161,92,0.2);
    color: var(--parchment);
    font-family:'Manrope';
    font-weight: 700;
    font-size: 15px;
    padding: 16px;
    border-radius: 12px;
    cursor:pointer;
  }
  .lang-btn:active{ transform: scale(0.98); }
  .lang-btn .flag{ font-size: 20px; }

  /* ---------- Header ---------- */
  .app-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 18px;
  }
  .app-header .eyebrow{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--gold);
    font-weight: 700;
  }
  .eyebrow{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 2px;
  }
  .app-header h1{
    font-size: 22px;
    margin: 2px 0 0;
    color: var(--parchment);
  }
  h1{
    font-size: 22px;
    margin: 2px 0 18px;
    color: var(--parchment);
  }
  .lang-toggle{
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(201,161,92,0.2);
    color: var(--parchment-dim);
    font-family:'Manrope';
    font-size: 12px;
    font-weight: 700;
    padding: 7px 12px;
    border-radius: 20px;
    cursor:pointer;
    flex-shrink:0;
  }

  /* ===== ПРОГРЕСС-БАР ===== */
  .progress-wrap {
    margin: 12px 0 18px;
  }
  .progress-label-row {
  display: flex;
  justify-content: space-between;
  font-size: 15px;
  font-weight: 700;
  color: var(--parchment);
  margin-bottom: 6px;
}
  .progress-track {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    border-radius: 4px;
    transition: width 0.6s ease;
  }

  /* ===== КНОПКА YOUTUBE (в стиле доната) ===== */
.youtube-btn {
  display: block;
  width: 100%;
  text-align: center;
  background: none;
  border: none;
  color: var(--parchment-dim);
  font-family: 'Manrope', sans-serif;
  font-size: 12.5px;
  padding: 18px 0 4px;
  cursor: pointer;
  opacity: 0.7;
  transition: opacity 0.2s ease;
}
.youtube-btn:active {
  opacity: 1;
  transform: scale(0.98);
}

  /* ---------- Charge indicator (signature element) ---------- */
  .charges{
    display:flex;
    gap: 6px;
    margin-top: 10px;
  }
  .charge-dot{
    flex:1;
    height: 6px;
    border-radius: 4px;
    background: rgba(255,255,255,0.08);
    position: relative;
    overflow: hidden;
  }
  .charge-dot.filled{
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    box-shadow: 0 0 10px rgba(201,161,92,0.55);
  }
  .charge-dot.current::after{
    content:'';
    position:absolute;
    inset:0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    animation: shimmer 1.8s infinite;
  }
  @keyframes shimmer{
    0%{ transform: translateX(-100%);}
    100%{ transform: translateX(100%);}
  }

  .progress-label{
    font-size: 12px;
    color: var(--parchment-dim);
    margin-top: 8px;
  }

  /* ---------- Lesson list ---------- */
  .lesson-list{
    display:flex;
    flex-direction:column;
    gap: 10px;
    margin-top: 18px;
  }
  .lesson-card{
    display:flex;
    align-items:center;
    gap: 14px;
    background: var(--bg-elevated);
    border: 1px solid rgba(201,161,92,0.12);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor:pointer;
    transition: transform .15s ease, border-color .15s ease;
  }
  .lesson-card:active{ transform: scale(0.98); }
  .lesson-card.done{ border-color: rgba(111,169,122,0.4); }
  .lesson-card.locked{ opacity: 0.45; }
  .lesson-num{
    font-family:'Cinzel', serif;
    font-size: 13px;
    font-weight: 700;
    width: 30px;
    height:30px;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(201,161,92,0.12);
    color: var(--gold);
    flex-shrink:0;
  }
  .lesson-card.done .lesson-num{
    background: rgba(111,169,122,0.18);
    color: var(--success);
  }
  .lesson-title{
    font-size: 15px;
    font-weight: 700;
    color: var(--parchment);
  }
  .lesson-sub{
    font-size: 12px;
    color: var(--parchment-dim);
    margin-top: 2px;
  }
  .lesson-check{
    margin-left:auto;
    font-size: 18px;
    color: var(--success);
  }
  .topic-icon{
    font-size: 20px;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: rgba(201,161,92,0.1);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .topic-progress{
    font-size: 11px;
    color: var(--parchment-dim);
    margin-top: 2px;
  }
  .soon-badge{
    margin-left:auto;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
    color: var(--parchment-dim);
    background: rgba(255,255,255,0.06);
    padding: 4px 10px;
    border-radius: 20px;
    flex-shrink:0;
  }
  .lesson-card.soon{
    opacity: 0.6;
    cursor: default;
  }
  .lesson-card.soon:active{ transform: none; }
  .support-link{
    display:block;
    width:100%;
    text-align:center;
    background: none;
    border: none;
    color: var(--parchment-dim);
    font-family:'Manrope';
    font-size: 12.5px;
    padding: 18px 0 4px;
    cursor:pointer;
    opacity: 0.7;
  }
  .support-link:active{ opacity: 1; }

  /* ---------- Lesson view ---------- */
  .lesson-view{ display:none; }
  .lesson-view.active{ display:block; }
  #lang-view.hidden{ display:none; }

  /* ===== ОТДЕЛЬНЫЕ СТРАНИЦЫ С АНИМАЦИЕЙ ===== */
  #topics-view,
  #home-view,
  #lesson-view {
    position: relative;
    transition: opacity 0.35s ease, transform 0.35s ease;
    background: transparent;
    padding: 0;
    min-height: 80vh;
  }

  /* Скрытые страницы */
  #topics-view.hidden,
  #home-view.hidden,
  #lesson-view.hidden {
    display: block !important;
    opacity: 0;
    transform: translateX(30px);
    pointer-events: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    min-height: 80vh;
  }

  /* Видимые страницы */
  #topics-view:not(.hidden),
  #home-view:not(.hidden),
  #lesson-view:not(.hidden) {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
    position: relative;
  }

  /* Анимация входа */
  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateX(30px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  #home-view:not(.hidden) {
    animation: slideIn 0.35s ease forwards;
  }

  #lesson-view.active {
    animation: slideIn 0.35s ease forwards;
  }

  .back-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:none;
  border:none;
  color: var(--gold);
  font-family:'Manrope';
  font-size: 15px;
  font-weight: 700;
  padding: 8px 0;
  margin-bottom: 10px;
  cursor:pointer;
  transition: opacity 0.2s ease;
}
.back-btn:active {
  opacity: 0.6;
}
  .lesson-eyebrow{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--violet);
    font-weight: 700;
  }
  .lesson-view h2{
    font-size: 20px;
    margin: 6px 0 14px;
    color: var(--parchment);
  }
  .lesson-body p{
    font-size: 15px;
    line-height: 1.6;
    color: var(--parchment);
    margin: 0 0 14px;
  }
  .lesson-img{
    width: 100%;
    border-radius: var(--radius);
    display: block;
    margin-bottom: 16px;
    border: 1px solid rgba(201,161,92,0.18);
    background: rgba(255,255,255,0.03);
  }
  .tip-box{
    background: rgba(139,111,201,0.12);
    border-left: 3px solid var(--violet);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--parchment);
    margin: 16px 0;
  }
  .tip-box b{ color: var(--violet); }

  /* ---------- Quiz ---------- */
  .quiz{
    margin-top: 22px;
    background: var(--bg-elevated);
    border-radius: var(--radius);
    padding: 16px;
    border: 1px solid rgba(201,161,92,0.15);
  }
  .quiz-q{
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--parchment);
  }
  .quiz-opt{
    display:block;
    width:100%;
    text-align:left;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--parchment);
    font-family:'Manrope';
    font-size: 13.5px;
    padding: 11px 14px;
    border-radius: 10px;
    margin-bottom: 8px;
    cursor:pointer;
  }
  .quiz-opt.correct{
    border-color: var(--success);
    background: rgba(111,169,122,0.15);
  }
  .quiz-opt.wrong{
    border-color: var(--danger);
    background: rgba(201,96,92,0.15);
  }
  .quiz-feedback{
    font-size: 13px;
    margin-top: 8px;
    color: var(--parchment-dim);
    display:none;
  }
  .quiz-feedback.show{ display:block; }

  .primary-btn{
    width:100%;
    background: linear-gradient(135deg, var(--gold), var(--gold-dim));
    color: #1A1508;
    font-family:'Manrope';
    font-weight: 800;
    font-size: 15px;
    border:none;
    border-radius: 12px;
    padding: 14px;
    margin-top: 20px;
    cursor:pointer;
    display:none;
  }
  .primary-btn.show{ display:block; }
  .primary-btn:active{ transform: scale(0.98); }

  /* ---------- Completion ---------- */
  .completion{
    text-align:center;
    padding: 40px 10px;
    display:none;
  }
  .completion.show{ display:block; }
  .completion .badge{
    font-size: 48px;
    margin-bottom: 12px;
  }

  /* ===== ПРЕМИУМ ===== */
  .premium-btn{
    display: block;
    width: 100%;
    text-align: center;
    background: none;
    border: none;
    color: var(--gold);
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 13px;
    padding: 12px 0 4px;
    cursor: pointer;
    opacity: 0.95;
  }
  .premium-btn:active{ opacity: 1; transform: scale(0.98); }
  .premium-intro{
    background: linear-gradient(135deg, rgba(201,161,92,0.14), rgba(201,161,92,0.04));
    border: 1px solid rgba(201,161,92,0.3);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 18px;
  }
  .premium-intro h2{
    font-family:'Cinzel', serif;
    color: var(--gold);
    font-size: 18px;
    margin: 0 0 8px;
  }
  .premium-intro p{
    font-size: 13.5px;
    color: var(--parchment-dim);
    line-height: 1.5;
    margin: 0 0 10px;
  }
  .premium-intro ul{ list-style:none; padding:0; margin: 10px 0; }
  .premium-intro li{ font-size: 13.5px; color: var(--parchment); padding: 4px 0; }
  .premium-intro li::before{ content: '✓ '; color: var(--success); font-weight: 700; }
  .premium-tile{
    display:flex;
    align-items:center;
    gap: 14px;
    background: var(--bg-elevated);
    border: 1px solid rgba(201,161,92,0.25);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor:pointer;
  }
  .premium-tile:active{ transform: scale(0.98); }
  .premium-tile-lock{ margin-left:auto; font-size: 16px; opacity: 0.7; }
  .tier-card{
    background: var(--bg-elevated);
    border: 1px solid rgba(201,161,92,0.25);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
  }
  .tier-name{
    font-family:'Cinzel', serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--gold);
  }
  .tier-price{
    font-size: 22px;
    font-weight: 800;
    color: var(--parchment);
    margin: 6px 0 10px;
  }
  .tier-perks{ list-style: none; padding: 0; margin: 0 0 14px; }
  .tier-perks li{ font-size: 13.5px; color: var(--parchment-dim); padding: 4px 0; }
  .tier-perks li::before{ content: '✓ '; color: var(--success); font-weight: 700; }
  .tier-buy-btn{
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dim));
    color: #1A1508;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-family: 'Manrope', sans-serif;
    font-size: 14.5px;
  }
  .tier-buy-btn:disabled{ opacity: 0.6; cursor: default; }
  .premium-badge{
    display:inline-block;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    color: #1A1508;
    background: var(--gold);
    padding: 3px 9px;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  .lock-screen{
    text-align:center;
    padding: 40px 20px;
  }
  .lock-screen .lock-icon{ font-size: 40px; margin-bottom: 14px; }
  .calc-skills{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 14px 0;
  }
  .calc-skill-chip{
    display:flex;
    align-items:center;
    gap: 6px;
    background: rgba(201,161,92,0.08);
    border: 1px solid rgba(201,161,92,0.2);
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 13px;
    color: var(--parchment);
    cursor: pointer;
    font-family: 'Manrope', sans-serif;
  }
  .calc-skill-chip.selected{
    background: rgba(201,161,92,0.28);
    border-color: var(--gold);
    color: var(--gold);
    font-weight: 700;
  }
  .calc-result-box{
    background: var(--bg-elevated);
    border: 1px solid rgba(111,169,122,0.35);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-top: 10px;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--parchment-dim);
  }
  .calc-result-box.empty{
    border-color: rgba(255,255,255,0.08);
    color: var(--parchment-dim);
    opacity: 0.7;
  }
  .calc-cat-group{ margin-bottom: 4px; }
  .calc-cat-label{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    color: var(--gold);
    margin: 12px 0 6px;
  }
  .calc-stats-box{ margin: 6px 0 4px; }
  .calc-stats-title{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    color: var(--parchment-dim);
    margin-bottom: 10px;
  }
  .calc-stat-row{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .calc-stat-label{
    font-size: 12.5px;
    color: var(--parchment);
    width: 110px;
    flex-shrink: 0;
  }
  .calc-stat-track{
    flex: 1;
    height: 8px;
    background: rgba(255,255,255,0.06);
    border-radius: 6px;
    overflow: hidden;
  }
  .calc-stat-fill{
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    border-radius: 6px;
    transition: width 0.4s ease;
  }
  .calc-counter-box{
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .calc-counter-label{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
    color: #C96262;
  }
  .calc-result-heading{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
    color: var(--success);
    margin-bottom: 6px;
  }
  .calc-subtip{
    background: rgba(201,161,92,0.08);
    border: 1px solid rgba(201,161,92,0.2);
    border-radius: 10px;
    padding: 10px 12px;
    margin-top: 8px;
    font-size: 12.5px;
    color: var(--parchment);
  }

  /* ===== ПЕСОЧНИЦА ===== */
  .sandbox-btn-tile{
    display:flex;
    align-items:center;
    gap: 14px;
    background: linear-gradient(135deg, rgba(111,169,122,0.14), rgba(111,169,122,0.04));
    border: 1px solid rgba(111,169,122,0.35);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor:pointer;
    margin-bottom: 14px;
  }
  .sandbox-btn-tile:active{ transform: scale(0.98); }
  .sandbox-progress-pill{
    margin-left:auto;
    font-size: 11px;
    color: var(--success);
    background: rgba(111,169,122,0.15);
    padding: 3px 9px;
    border-radius: 20px;
  }
  .sb-scenario-card{
    background: var(--bg-elevated);
    border: 1px solid rgba(201,161,92,0.15);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    display:flex;
    align-items:center;
    gap: 12px;
    cursor:pointer;
  }
  .sb-scenario-card.done{ border-color: rgba(111,169,122,0.4); }
  .sb-scenario-card.locked{ opacity: 0.6; }
  .sb-scenario-num{
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(201,161,92,0.15);
    color: var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-weight: 700;
    flex-shrink: 0;
  }
  .sb-scenario-card.done .sb-scenario-num{ background: rgba(111,169,122,0.25); color: var(--success); }
  .sb-situation-box{
    background: var(--bg-elevated);
    border: 1px solid rgba(201,161,92,0.15);
    border-radius: var(--radius);
    padding: 16px;
    font-size: 14px;
    line-height: 1.55;
    margin: 14px 0 18px;
  }
  .sb-choose-label{
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 10px;
  }
  .sb-option-btn{
    display:flex;
    align-items:flex-start;
    gap: 10px;
    width: 100%;
    text-align:left;
    background: var(--bg-elevated);
    border: 1px solid rgba(201,161,92,0.2);

<script>
let tg = null;
try {
  tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#14121F');
    tg.setBackgroundColor('#14121F');
  }
} catch (e) {
  console.error('Telegram WebApp init failed, continuing without it:', e);
  tg = null;
}

// ===== ГЛОБАЛЬНЫЙ ТАКТИЛЬНЫЙ ОТКЛИК (HAPTIC) =====
// Срабатывает на любое нажатие кнопки, темы, урока, пункта меню — на всех экранах.
function haptic(style) {
  try {
    if (tg && tg.HapticFeedback) {
      tg.HapticFeedback.impactOccurred(style || 'light');
    }
  } catch (e) {}
}
document.addEventListener('click', function(e) {
  const el = e.target.closest(
    'button, [onclick], .lesson-item, .topic-item, .sandbox-btn-tile, ' +
    '.sb-scenario-card, .premium-tile, .lang-btn, .lock-screen button, a'
  );
  if (el) haptic('light');
}, true);
// ===================================================

// ---------- Storage ----------
function cloudStorageAvailable() {
  try {
    if (!tg || !tg.CloudStorage) return false;
    if (typeof tg.isVersionAtLeast === 'function') {
      return tg.isVersionAtLeast('6.9');
    }
    return true;
  } catch (e) {
    return false;
  }
}

function withTimeout(promise, ms, fallbackValue) {
  return Promise.race([
    promise,
    new Promise((resolve) => setTimeout(() => resolve(fallbackValue), ms))
  ]);
}

const Storage = {
  async get(key) {
    if (!cloudStorageAvailable()) {
      return localStorage.getItem(key);
    }
    const cloudPromise = new Promise((resolve) => {
      try {
        tg.CloudStorage.getItem(key, (err, value) => resolve(err ? null : value));
      } catch (e) {
        resolve(localStorage.getItem(key));
      }
    });
    return withTimeout(cloudPromise, 1200, localStorage.getItem(key));
  },
  async set(key, value) {
    if (!cloudStorageAvailable()) {
      localStorage.setItem(key, value);
      return;
    }
    const cloudPromise = new Promise((resolve) => {
      try {
        tg.CloudStorage.setItem(key, value, () => resolve());
      } catch (e) {
        localStorage.setItem(key, value);
        resolve();
      }
    });
    await withTimeout(cloudPromise, 1200, null);
    localStorage.setItem(key, value);
  }
};

function updateProgress() {
  let totalLessons = 0;
  let completedLessons = 0;
  TOPICS.forEach(topic => {
    topic.lessons.forEach(lesson => {
      totalLessons++;
      if (completed.has(lesson.id)) completedLessons++;
    });
  });
  const percent = totalLessons === 0 ? 0 : Math.round((completedLessons / totalLessons) * 100);
  const percentEl = document.getElementById('progress-percent');
  const barEl = document.getElementById('progress-bar');
  if (percentEl) percentEl.textContent = percent + '%';
  if (barEl) barEl.style.width = percent + '%';
}

// Общий (не кураторский) разбор пары навыков — строится из их реальных описаний с вики,
// используется только когда для пары нет вручную написанной синергии в SYNERGY_PAIRS.
function genericSynergyText(idA, idB) {
  const a = SKILLS.find(s => s.id === idA);
  const b = SKILLS.find(s => s.id === idB);
  if (!a || !b) return null;
  if (currentLang === 'ru') {
    return `${a.ru} (${a.desc.ru}) и ${b.ru} (${b.desc.ru}) не образуют широко известную «именную» связку, но ничто не мешает взять оба — герой получит сразу оба эффекта.`;
  }
  return `${a.en} (${a.desc.en}) and ${b.en} (${b.desc.en}) don't form a well-known "named" combo, but nothing stops you from taking both — the hero simply gets both effects.`;
}

function getSynergyText(skillIds) {
  if (skillIds.length < 2) return null;
  const results = [];
  for (let i = 0; i < skillIds.length; i++) {
    for (let j = i + 1; j < skillIds.length; j++) {
      const key1 = `${skillIds[i]}|${skillIds[j]}`;
      const key2 = `${skillIds[j]}|${skillIds[i]}`;
      const entry = SYNERGY_PAIRS[key1] || SYNERGY_PAIRS[key2];
      if (entry) {
        results.push(entry[currentLang]);
      } else {
        const fallback = genericSynergyText(skillIds[i], skillIds[j]);
        if (fallback) results.push(fallback);
      }
    }
  }
  return results;
}

function computeArchetype(skillIds) {
  if (skillIds.length === 0) return null;
  const cats = [...new Set(skillIds.map(id => SKILLS.find(s => s.id === id).arch))].sort();
  const key = cats.join('+');
  return ARCHETYPES[key] || null;
}

function computeCategoryFill(skillIds) {
  const fill = { combat: 0, magic: 0, mobility: 0, economy: 0 };
  skillIds.forEach(id => {
    const s = SKILLS.find(x => x.id === id);
    if (s) fill[s.arch] = Math.min(2, fill[s.arch] + 1);
  });
  return fill;
}

function computeSynergyScore(skillIds) {
  if (skillIds.length < 2) return null;
  let possible = 0, found = 0;
  for (let i = 0; i < skillIds.length; i++) {
    for (let j = i + 1; j < skillIds.length; j++) {
      possible++;
      const key1 = `${skillIds[i]}|${skillIds[j]}`;
      const key2 = `${skillIds[j]}|${skillIds[i]}`;
      if (SYNERGY_PAIRS[key1] || SYNERGY_PAIRS[key2]) found++;
    }
  }
  return { score: Math.round((found / possible) * 10), found, possible };
}

function renderSandboxHub() {

  setText('sandbox-hub-title', t('sandboxHubTitle'));
  setText('sandbox-hub-intro', t('sandboxHubIntro'));
  setText('sandbox-hub-back-label', t('sandboxBackToHub'));

  const list = document.getElementById('sandbox-scenarios-list');
  list.innerHTML = '';
  SANDBOX_SCENARIOS.forEach((sc, i) => {
    const content = sc[currentLang];
    const done = sandboxCompleted.has(sc.id);
    const locked = !sc.free && !isSubscribed;
    const card = document.createElement('div');
    card.className = 'sb-scenario-card' + (done ? ' done' : '') + (locked ? ' locked' : '');
    card.onclick = () => (locked ? openSubscribe() : openSandboxScenario(i));
    card.innerHTML = `
      <div class="sb-scenario-num">${done ? '✓' : (i + 1)}</div>
      <div style="flex:1;">
        <div class="lesson-title">${content.icon} ${content.title}</div>
      </div>
      ${locked ? '<div class="premium-tile-lock">🔒</div>' : ''}
    `;
    list.appendChild(card);
  });
}

function openSandboxScenario(index) {
  const sc = SANDBOX_SCENARIOS[index];
  if (!sc.free && !isSubscribed) { 
    openSubscribe(); 
    return; 
  }

  currentSandboxIndex = index;
  document.getElementById('sandbox-hub-view').classList.add('hidden');
  document.getElementById('sandbox-play-view').classList.remove('hidden');
  setText('sandbox-play-back-label', t('sandboxBackToList'));
  renderSandboxScenario();
}

function renderSandboxScenario() {
  const sc = SANDBOX_SCENARIOS[currentSandboxIndex];
  const content = sc[currentLang];
  const body = document.getElementById('sandbox-play-body');
  const letters = currentLang === 'ru' ? ['А', 'Б', 'В', 'Г'] : ['A', 'B', 'C', 'D'];
  
  body.innerHTML = `
    <div class="eyebrow">${t('sandboxStepLabel', currentSandboxIndex + 1, SANDBOX_SCENARIOS.length)}</div>
    <h1>${content.icon} ${content.title}</h1>
    <div class="sb-situation-box">${content.situation}</div>
    <div class="sb-choose-label">${t('sandboxChooseLabel')}</div>
    <div id="sb-options"></div>
    <div class="sb-feedback" id="sb-feedback"></div>
    <div id="sb-next-wrap"></div>
  `;
  
  const optsWrap = document.getElementById('sb-options');
  content.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'sb-option-btn';
    btn.innerHTML = `<span class="sb-option-letter">${letters[i]}</span> ${opt}`;
    btn.onclick = () => answerSandbox(i);
    optsWrap.appendChild(btn);
  });

  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  
  // Прокрутка наверх (как в основном боте)
  window.scrollTo(0, 0);
}

function answerSandbox(chosen) {
  const sc = SANDBOX_SCENARIOS[currentSandboxIndex];
  const content = sc[currentLang];
  const opts = document.querySelectorAll('#sb-options .sb-option-btn');
  const feedback = document.getElementById('sb-feedback');
  const nextWrap = document.getElementById('sb-next-wrap');
  
  const correctAnswer = content.correct;
  const isCorrect = (chosen === correctAnswer);

  opts.forEach((btn, i) => {
    btn.disabled = true;
    btn.onclick = null;
    
    if (i === correctAnswer) {
      btn.classList.add('sb-correct');
    }
    
    if (i === chosen && i !== correctAnswer) {
      btn.classList.add('sb-wrong');
    }
  });

  feedback.className = 'sb-feedback explain show';
  
  if (isCorrect) {
    feedback.textContent = '✅ ' + t('correctFeedback') + ' ' + content.explain;
  } else {
    feedback.textContent = '❌ ' + t('wrongFeedback') + ' ' + content.explain;
  }

  sandboxCompleted.add(sc.id);
  saveSandboxProgress();

  nextWrap.innerHTML = `<button class="sb-next-btn" onclick="sandboxGoNext()">${t('sandboxNext')}</button>`;
  setTimeout(() => {
    nextWrap.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }, 100);
}

function sandboxGoNext() {
  const nextIndex = currentSandboxIndex + 1;
  
  if (nextIndex >= SANDBOX_SCENARIOS.length) {
    const body = document.getElementById('sandbox-play-body');
    body.innerHTML = `
      <div class="completion show" style="display:block;">
        <div class="badge">🏆</div>
        <h2>${t('sandboxDone')}</h2>
        <p style="color:var(--parchment-dim); font-size:14px;">${t('sandboxDoneText')}</p>
        <button class="primary-btn show" onclick="goSandboxHub()" style="display:block;">Вернуться в песочницу</button>
      </div>
    `;
    window.scrollTo(0, 0);
    return;
  }

  const nextSc = SANDBOX_SCENARIOS[nextIndex];
  if (!nextSc.free && !isSubscribed) {
    const body = document.getElementById('sandbox-play-body');
    body.innerHTML = `
      <div class="lock-screen">
        <div class="lock-icon">🔒</div>
        <h2>${t('sandboxUpsellTitle')}</h2>
        <p style="color:var(--parchment-dim);">${t('sandboxUpsellText')}</p>
        <button class="primary-btn show" onclick="openSubscribe()">${t('lockedBtn')}</button>
      </div>
    `;
    window.scrollTo(0, 0);
    return;
  }
  
  openSandboxScenario(nextIndex);
}

}

function openLesson(index) {
  currentLessonIndex = index;
  const l = TOPICS[currentTopicIndex].lessons[index];
  const content = l[currentLang];
  
  // Перемешиваем вопросы
  const shuffledQuizzes = content.quizzes.map(quiz => {
    const shuffled = shuffleQuizOptions(quiz);
    return {
      q: quiz.q,
      options: shuffled.options,
      correct: shuffled.correct
    };
  });
  
  quizAnswered = new Array(shuffledQuizzes.length).fill(false);

  document.getElementById('home-view').classList.add('hidden');
  document.getElementById('lesson-view').classList.add('active');

  setText('back-btn-label', t('backBtn'));
  setText('lv-eyebrow', content.eyebrow);
  setText('lv-title', content.title);

  const body = document.getElementById('lv-body');
  const imageHtml = l.image
    ? `<img src="${l.image}" class="lesson-img" alt="${content.title}" loading="lazy" onerror="this.style.display='none'">`
    : '';
  body.innerHTML = imageHtml + content.body.map(p => `<p>${p}</p>`).join('') +
    `<div class="tip-box"><b>${t('tipLabel')}</b> ${content.tip}</div>`;

  const quizContainer = document.getElementById('lv-quiz');
  quizContainer.innerHTML = '';
  document.getElementById('complete-btn').className = 'primary-btn';
  setText('complete-btn', t('completeBtn'));

  shuffledQuizzes.forEach((quiz, qIndex) => {
    const block = document.createElement('div');
    block.className = 'quiz';
    block.style.marginTop = qIndex === 0 ? '22px' : '14px';
    block.innerHTML = `
      <div class="quiz-q">${qIndex + 1}. ${quiz.q}</div>
      <div class="quiz-opts-${qIndex}"></div>
      <div class="quiz-feedback" id="quiz-feedback-${qIndex}"></div>
    `;
    quizContainer.appendChild(block);

    const optsWrap = block.querySelector(`.quiz-opts-${qIndex}`);
    quiz.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'quiz-opt';
      btn.textContent = opt;
      btn.onclick = () => answerQuiz(qIndex, i, quiz.correct);
      optsWrap.appendChild(btn);
    });
  });

  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  window.scrollTo(0, 0);
}

function answerQuiz(quizIndex, chosen, correct) {
  const block = document.querySelectorAll('#lv-quiz .quiz')[quizIndex];
  const opts = block.querySelectorAll('.quiz-opt');
  opts.forEach((btn, i) => {
    btn.onclick = null;
    if (i === correct) btn.classList.add('correct');
    else if (i === chosen) btn.classList.add('wrong');
  });
  const feedback = document.getElementById(`quiz-feedback-${quizIndex}`);
  feedback.textContent = chosen === correct ? t('correctFeedback') : t('wrongFeedback');
  feedback.classList.add('show');

  quizAnswered[quizIndex] = true;
  if (quizAnswered.every(Boolean)) {
    document.getElementById('complete-btn').classList.add('show');
  }

  if (tg && tg.HapticFeedback) {
    tg.HapticFeedback.notificationOccurred(chosen === correct ? 'success' : 'error');
  }
}

async function completeLesson() {
  const l = TOPICS[currentTopicIndex].lessons[currentLessonIndex];
  completed.add(l.id);
  await Storage.set('completed_lessons', JSON.stringify([...completed]));
  updateProgress();
  renderHome();
}

function firstIncompleteIndex() {
  const lessons = TOPICS[currentTopicIndex].lessons;
  for (let i = 0; i < lessons.length; i++) {
    if (!completed.has(lessons[i].id)) return i;
  }
  return lessons.length - 1;
}

// Функция для перемешивания вариантов ответов
function shuffleQuizOptions(quiz) {
  const indices = [0, 1, 2];
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  
  const correctAnswer = quiz.options[quiz.correct];
  const shuffledOptions = indices.map(i => quiz.options[i]);
  const newCorrectIndex = shuffledOptions.indexOf(correctAnswer);
  
  return {
    options: shuffledOptions,
    correct: newCorrectIndex
  };
}

async function checkSubscription() {
  if (PREVIEW_MODE_UNLOCK_ALL) { isSubscribed = true; return true; }
  if (!tg || !tg.initData) { isSubscribed = false; return false; }
  try {
    const res = await fetch(`${WORKER_URL}/check-subscription?initData=${encodeURIComponent(tg.initData)}`);
    const data = await res.json();
    isSubscribed = !!(data.ok && data.subscribed);
  } catch (e) {
    isSubscribed = false;
  }
  return isSubscribed;
}

function renderCalcSkills() {
  const wrap = document.getElementById('calc-skills-groups');
  wrap.innerHTML = '';
  ['combat', 'magic', 'economy', 'leadership', 'faction'].forEach(catId => {
    const cat = SKILL_CATEGORIES[catId];
    const group = document.createElement('div');
    group.className = 'calc-cat-group';
    group.innerHTML = `<div class="calc-cat-label">${cat.icon} ${cat[currentLang]}</div>`;
    const chipsRow = document.createElement('div');

      chip.className = 'calc-skill-chip' + (selectedSkills.includes(skill.id) ? ' selected' : '');
      chip.title = skill.desc ? skill.desc[currentLang] : '';
      chip.innerHTML = `${skill.icon} ${skill[currentLang]}`;
      chip.onclick = () => toggleSkillChip(skill.id);
      chipsRow.appendChild(chip);
    });
    group.appendChild(chipsRow);
    wrap.appendChild(group);
  });
}

function toggleSkillChip(skillId) {
  const i = selectedSkills.indexOf(skillId);
  if (i >= 0) {
    selectedSkills.splice(i, 1);
  } else {
    if (selectedSkills.length >= 3) selectedSkills.shift();
    selectedSkills.push(skillId);
  }
  renderCalcSkills();
  renderCalcOutput();
}

  if (!bodyHtml && !tipsHtml && !synergyHTML) {
    box.className = 'calc-result-box empty';
    box.textContent = t('calcEmpty');
  } else {
    box.className = 'calc-result-box';
    box.innerHTML = (bodyHtml ? `<div class="calc-result-heading">${t('calcPairsTitle')}</div>${bodyHtml}` : '') + tipsHtml + synergyHTML;
  }
}

// ---------- Подписка ----------
function openSubscribe() {
  document.getElementById('premium-view').classList.add('hidden');
  document.getElementById('sandbox-hub-view').classList.add('hidden');
  document.getElementById('sandbox-play-view').classList.add('hidden');
  document.getElementById('premium-guide-view').classList.add('hidden');
  document.getElementById('premium-guides-hub-view').classList.add('hidden');
  document.getElementById('premium-calc-view').classList.add('hidden');
  document.getElementById('subscribe-view').classList.remove('hidden');
  renderSubscribeTiers();
  window.scrollTo(0, 0);
}

function renderSubscribeTiers() {
  setText('subscribe-eyebrow', t('subscribeEyebrow'));
  setText('subscribe-title', t('subscribeTitle'));
  setText('subscribe-back-label', t('premiumBackToHub'));

  const perks = t('premiumIntroPerks');
  const list = document.getElementById('subscribe-tiers-list');
  list.innerHTML = `
    <div class="tier-card">
      <div class="tier-name">Инсайдер</div>
      <div class="tier-price">⭐ ${SUB_PRICES.insider.stars} / ${currentLang === 'ru' ? 'мес' : 'mo'}</div>
      <ul class="tier-perks">${perks.map(p => `<li>${p}</li>`).join('')}</ul>
      <button class="tier-buy-btn" onclick="buyTier('insider')" id="buy-btn-insider">${t('payBtn')}</button>
    </div>
  `;

  const status = document.getElementById('subscribe-status');
  status.style.display = 'none';
}

async function buyTier(tier) {
  const status = document.getElementById('subscribe-status');
  const btn = document.getElementById(`buy-btn-${tier}`);

  if (!tg || !tg.initData) {
    status.style.display = 'block';
    status.textContent = t('notInTelegram');
    return;
  }

  btn.disabled = true;
  btn.textContent = t('payingBtn');

  try {
    const res = await fetch(`${WORKER_URL}/create-invoice`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: tg.initData, tier })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'invoice_failed');

    tg.openInvoice(data.link, async (result) => {
      btn.disabled = false;
      btn.textContent = t('payBtn');
      if (result === 'paid') {
        status.style.display = 'block';
        status.textContent = t('paySuccess');
        await checkSubscription();
      } else if (result === 'cancelled') {
        status.style.display = 'block';
        status.textContent = t('payCancelled');
      }
    });
  } catch (e) {
    btn.disabled = false;
    btn.textContent = t('payBtn');
    status.style.display = 'block';
    status.textContent = t('payError');
  }
}

// ---------- Привет в шортсе ----------

async function sendShoutout() {
  const textEl = document.getElementById('shoutout-text');
  const status = document.getElementById('shoutout-status');
  const btn = document.getElementById('shoutout-send-btn');
  const text = textEl.value.trim();
  if (!text) return;

  btn.disabled = true;
  try {
    await fetch(`${WORKER_URL}/feedback`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: `📣 ПРИВЕТ В ШОРТС:\n\n${text}`, initData: (tg && tg.initData) ? tg.initData : null })
    });
    status.style.display = 'block';
    status.textContent = t('shoutoutSent');
    textEl.value = '';
  } catch (e) {
    status.style.display = 'block';
    status.textContent = t('payError');
  }
  btn.disabled = false;
}

// ---------- ОБРАТНАЯ СВЯЗЬ ----------
function openFeedbackForm() {
  const form = document.getElementById('feedback-form');
  if (form.style.display === 'none' || form.style.display === '') {
    form.style.display = 'block';
    document.getElementById('feedback-text').focus();
  } else {
    form.style.display = 'none';
  }
}

function closeFeedbackForm() {
  document.getElementById('feedback-form').style.display = 'none';
  document.getElementById('feedback-text').value = '';
}

function sendFeedback() {
  const text = document.getElementById('feedback-text').value.trim();
  if (!text) {
    alert('✏️ Напишите сообщение!');
    return;
  }

  fetch(`${WORKER_URL}/feedback`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, initData: (tg && tg.initData) ? tg.initData : null })
  })
  .then(response => response.json())
  .then(data => {
    if (data.ok) {
      alert('✅ Спасибо! Сообщение отправлено.');
      closeFeedbackForm();
    } else {
      alert('❌ Ошибка: попробуйте позже.');
    }
  })
  .catch(() => {
    alert('❌ Ошибка соединения. Проверьте интернет.');
  });
}

function openFeedbackPage() {
  document.getElementById('topics-view').classList.add('hidden');
  document.getElementById('feedback-view').classList.remove('hidden');
}

function sendFeedbackNew() {
  const text = document.getElementById('feedback-text-new').value.trim();
  const status = document.getElementById('feedback-status');
  
  if (!text) {
    status.style.display = 'block';
    status.textContent = '✏️ Напишите сообщение!';
    status.style.color = 'var(--danger)';
    return;
  }

  status.style.display = 'block';
  status.textContent = '⏳ Отправка...';
  status.style.color = 'var(--parchment-dim)';

  fetch(`${WORKER_URL}/feedback`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, initData: (tg && tg.initData) ? tg.initData : null })
  })
  .then(response => response.json())
  .then(data => {
    if (data.ok) {
      status.textContent = '✅ Спасибо! Сообщение отправлено.';
      status.style.color = 'var(--success)';
      document.getElementById('feedback-text-new').value = '';
      setTimeout(() => {
        goTopics();
      }, 1500);
    } else {
      status.textContent = '❌ Ошибка: попробуйте позже.';
      status.style.color = 'var(--danger)';
    }
  })
  .catch(() => {
    status.textContent = '❌ Ошибка соединения. Проверьте интернет.';
    status.style.color = 'var(--danger)';
  });
}

// ===== КНОПКА "НАВЕРХ" =====
const scrollBtn = document.getElementById('scrollTopBtn');

function updateScrollBtn() {
  const scrolled = (window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0);
  if (scrolled > 300) {
    scrollBtn.classList.add('visible');
  } else {
    scrollBtn.classList.remove('visible');
  }
}

window.addEventListener('scroll', updateScrollBtn, { passive: true });

// Пересчитываем видимость кнопки при любой смене экрана
// (важно для песочницы и коротких страниц, где scroll может не сработать сам)
const scrollBtnObserver = new MutationObserver(() => {
  requestAnimationFrame(updateScrollBtn);
});
scrollBtnObserver.observe(document.getElementById('app'), {
  attributes: true,
  attributeFilter: ['class'],
  subtree: true
});

function scrollToTop() {
  // Двойной вызов надёжно перебивает "scroll anchoring" браузера,
  // из-за которого страница иногда не долистывает наверх
  // после смены DOM (баг: "не поднимается с последней темы")
  window.scrollTo(0, 0);
  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;
  requestAnimationFrame(() => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
}

};

function answerPremiumQuiz(quizIndex, chosen, correct) {
  // Находим блок викторины по индексу
  const allQuizzes = document.querySelectorAll('#premium-guide-quiz .quiz');
  const block = allQuizzes[quizIndex];
  
  if (!block) {
    console.error('Блок викторины не найден для индекса:', quizIndex);
    return;
  }
  
  // Находим все варианты ответов в этом блоке
  const opts = block.querySelectorAll('.quiz-opt');
  
  // Подсвечиваем правильный и выбранный ответы
  opts.forEach((btn, i) => {
    btn.onclick = null; // Отключаем повторные клики
    if (i === correct) {
      btn.classList.add('correct'); // Правильный ответ - зеленый
    } else if (i === chosen && i !== correct) {
      btn.classList.add('wrong'); // Неправильный выбранный - красный
    }
  });
  
  // Показываем feedback
  const feedback = document.getElementById(`pquiz-feedback-${quizIndex}`);
  if (feedback) {
    if (chosen === correct) {
      feedback.textContent = '✅ ' + t('correctFeedback');
    } else {
      feedback.textContent = '❌ ' + t('wrongFeedback');
    }
    feedback.classList.add('show');
  }
}


// Запуск
init();
