    --bg: #14121F;
    --bg-elevated: #1D1A2E;
    --gold: #C9A15C;
    --gold-dim: #7A6538;
    --violet: #8B6FC9;
    --parchment: #EDE6D6;
    --parchment-dim: #A8A2B8;
    --danger: #C9605C;

  body{

    color: var(--parchment);
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;

  h1,h2,h3, .display{

    letter-spacing: 0.02em;
  }
  #app{

    margin: 0 auto;
    padding: 20px 18px 40px;
    min-height: 100vh;
  }

  /* ---------- Language select screen ---------- */
  .lang-view{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height: 90vh;
    text-align:center;
  }
  .lang-view .badge{
    font-size: 40px;
    margin-bottom: 16px;
  }
  .lang-view h1{
    font-size: 24px;
    margin: 0 0 8px;
  }
  .lang-view p{
    color: var(--parchment-dim);
    font-size: 14px;
    margin: 0 0 28px;
  }
  .lang-options{
    display:flex;
    flex-direction:column;
    gap: 12px;
    width: 100%;
    max-width: 320px;
  }
  .lang-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    background: var(--bg-elevated);
    border: 1px solid rgba(201,161,92,0.2);
    color: var(--parchment);
    font-family:'Manrope';
    font-weight: 700;
    font-size: 15px;
    padding: 16px;
    border-radius: 12px;
    cursor:pointer;
  }
  .lang-btn:active{ transform: scale(0.98); }
  .lang-btn .flag{ font-size: 20px; }

  /* ---------- Header ---------- */
  .app-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 18px;
  }
  .app-header .eyebrow{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--gold);
    font-weight: 700;
  }
  .app-header h1{
    font-size: 22px;
    margin: 2px 0 0;
    color: var(--parchment);
  }
  .lang-toggle{
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(201,161,92,0.2);
    color: var(--parchment-dim);
    font-family:'Manrope';
    font-size: 12px;
    font-weight: 700;
    padding: 7px 12px;
    border-radius: 20px;
    cursor:pointer;
    flex-shrink:0;
  }

  /* ---------- Charge indicator (signature element) ---------- */
  .charges{
    display:flex;
    gap: 6px;
    margin-top: 10px;
  }
  .charge-dot{
    flex:1;
    height: 6px;
    border-radius: 4px;
    background: rgba(255,255,255,0.08);
    position: relative;
    overflow: hidden;
  }
  .charge-dot.filled{
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    box-shadow: 0 0 10px rgba(201,161,92,0.55);
  }
  .charge-dot.current::after{
    content:'';
    position:absolute;
    inset:0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    animation: shimmer 1.8s infinite;
  }
  @keyframes shimmer{
    0%{ transform: translateX(-100%);}
    100%{ transform: translateX(100%);}
  }

  .progress-label{
    font-size: 12px;
    color: var(--parchment-dim);
    margin-top: 8px;
  }

  /* ---------- Lesson list ---------- */

    display:flex;
    flex-direction:column;
    gap: 10px;
    margin-top: 18px;
  }
  .lesson-card{

    align-items:center;
    gap: 14px;
    background: var(--bg-elevated);
    border: 1px solid rgba(201,161,92,0.12);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor:pointer;
    transition: transform .15s ease, border-color .15s ease;

    font-weight: 700;

    justify-content:center;

  .support-link{

  tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#14121F');
    tg.setBackgroundColor('#14121F');
  }
} catch (e) {
  console.error('Telegram WebApp init failed, continuing without it:', e);
  tg = null;
}

// ---------- Storage: Telegram CloudStorage with localStorage fallback ----------
function cloudStorageAvailable() {
  try {
    if (!tg || !tg.CloudStorage) return false;
    if (typeof tg.isVersionAtLeast === 'function') {
      return tg.isVersionAtLeast('6.9');
    }
    return true;
  } catch (e) {
    return false;
  }
}

function withTimeout(promise, ms, fallbackValue) {
  return Promise.race([
    promise,
    new Promise((resolve) => setTimeout(() => resolve(fallbackValue), ms))
  ]);
}

const Storage = {
  async get(key) {
    if (!cloudStorageAvailable()) {
      return localStorage.getItem(key);
    }
    const cloudPromise = new Promise((resolve) => {
      try {
        tg.CloudStorage.getItem(key, (err, value) => resolve(err ? null : value));
      } catch (e) {
        resolve(localStorage.getItem(key));
      }
    });
    return withTimeout(cloudPromise, 1200, localStorage.getItem(key));
  },
  async set(key, value) {
    if (!cloudStorageAvailable()) {
      localStorage.setItem(key, value);
      return;
    }
    const cloudPromise = new Promise((resolve) => {
      try {
        tg.CloudStorage.setItem(key, value, () => resolve());
      } catch (e) {
        localStorage.setItem(key, value);
        resolve();
      }
    });
    await withTimeout(cloudPromise, 1200, null);
    localStorage.setItem(key, value); // mirror locally as a safety net
  }
};

let currentTopicIndex = null;
let completed = new Set();
let currentLessonIndex = null;
let quizAnswered = [];

// ---------- Language handling ----------
async function selectLanguage(lang) {
  try {
    currentLang = lang;
    await Storage.set('lang', lang);
    document.getElementById('lang-view').classList.add('hidden');
    document.getElementById('topics-view').classList.remove('hidden');
    renderTopics();
  } catch (e) {
    console.error('selectLanguage error:', e);
  }
}

async function toggleLanguage() {
  currentLang = currentLang === 'ru' ? 'en' : 'ru';
  await Storage.set('lang', currentLang);
  if (!document.getElementById('home-view').classList.contains('hidden')) {
    renderHome(true);
  } else {
    renderTopics();
  }
}

function t(key, ...args) {
  const val = STRINGS[currentLang][key];
  return typeof val === 'function' ? val(...args) : val;
}

// ---------- Init ----------
// ---------- Visitor counter (private, checked only via the key's URL) ----------
const VISIT_COUNTER_KEY = 'charmroad_olden_era_bot_unique_visitors_2026';

async function countFirstVisit() {
  try {
    const alreadyCounted = await Storage.get('visit_counted');
    if (alreadyCounted) return;
    await fetch(`https://countapi.mileshilliard.com/api/v1/hit/${VISIT_COUNTER_KEY}`);
    await Storage.set('visit_counted', '1');
  } catch (e) {
    // Silently ignore — never block the app if the counter service is unavailable
    console.error('Visit counter failed:', e);
  }
}

async function init() {
  const savedLang = await Storage.get('lang');
  const saved = await Storage.get('completed_lessons');
  if (saved) {
    try { completed = new Set(JSON.parse(saved)); } catch(e) {}
  }

  countFirstVisit();

  if (savedLang === 'ru' || savedLang === 'en') {
    currentLang = savedLang;
    document.getElementById('lang-view').classList.add('hidden');
    document.getElementById('topics-view').classList.remove('hidden');
    renderTopics();
  }
}

// ---------- Topics screen ----------
function topicProgress(topic) {
  const done = topic.lessons.filter(l => completed.has(l.id)).length;
  return { done, total: topic.lessons.length };
}

function renderTopics() {
  document.getElementById('lesson-view').classList.remove('active');
  document.getElementById('completion-view').classList.remove('show');
  document.getElementById('home-view').classList.add('hidden');
  document.getElementById('topics-view').classList.remove('hidden');

  setText('topics-eyebrow', t('topicsEyebrow'));
  setText('topics-title', t('topicsTitle'));
  setText('topics-lang-toggle-btn', t('langToggle'));
  setText('support-link-label', t('supportLink'));

  const list = document.getElementById('topics-list');
  list.innerHTML = '';
  TOPICS.forEach((topic, i) => {
    const content = topic[currentLang];
    const isEmpty = topic.lessons.length === 0;
    const { done, total } = topicProgress(topic);
    const card = document.createElement('div');
    card.className = 'lesson-card' + (isEmpty ? ' soon' : '');
    card.onclick = () => openTopic(i);
    card.innerHTML = `
      <div class="topic-icon">${topic.icon}</div>
      <div>
        <div class="lesson-title">${content.title}</div>
        <div class="topic-progress">${isEmpty ? '' : t('progressLabel', done, total)}</div>
      </div>
      ${isEmpty ? `<div class="soon-badge">${t('comingSoon')}</div>` : (done === total ? '<div class="lesson-check">✓</div>' : '')}
    `;
    list.appendChild(card);
  });
}

function openTopic(index) {
  const topic = TOPICS[index];
  if (topic.lessons.length === 0) return; // coming soon, not clickable
  currentTopicIndex = index;
  document.getElementById('topics-view').classList.add('hidden');
  document.getElementById('home-view').classList.remove('hidden');
  renderHome();
}

function goTopics() {
  renderTopics();
}

function renderHome(forceList) {
  const topic = TOPICS[currentTopicIndex];
  const lessons = topic.lessons;
  const total = lessons.length;

  setText('home-eyebrow', topic[currentLang].title);
  setText('home-title', t('homeTitle'));
  setText('topics-back-label', t('backToTopics'));
  setText('lang-toggle-btn', t('langToggle'));
  setText('back-btn-label', t('backBtn'));
  setText('complete-btn', t('completeBtn'));
  setText('completion-title', t('completionTitle'));
  setText('completion-text', t('completionText'));
  setText('completion-btn', t('completionBtn'));
  setText('completion-support-label', t('supportLink'));

  const chargesRow = document.getElementById('charges-row');
  chargesRow.innerHTML = '';
  lessons.forEach((l, i) => {
    const dot = document.createElement('div');
    dot.className = 'charge-dot' + (completed.has(l.id) ? ' filled' : '') + (i === firstIncompleteIndex() ? ' current' : '');
    chargesRow.appendChild(dot);
  });
  const doneCount = lessons.filter(l => completed.has(l.id)).length;
  setText('progress-label', t('progressLabel', doneCount, total));

  const list = document.getElementById('lesson-list');
  list.innerHTML = '';
  lessons.forEach((l, i) => {
    const content = l[currentLang];
    const card = document.createElement('div');
    const isDone = completed.has(l.id);
    card.className = 'lesson-card' + (isDone ? ' done' : '');
    card.onclick = () => openLesson(i);
    card.innerHTML = `
      <div class="lesson-num">${i+1}</div>
      <div>
        <div class="lesson-title">${content.title}</div>
        <div class="lesson-sub">${content.eyebrow}</div>
      </div>
      ${isDone ? '<div class="lesson-check">✓</div>' : ''}
    `;
    list.appendChild(card);
  });

  document.getElementById('lesson-view').classList.remove('active');

  if (!forceList && total > 0 && doneCount === total) {
    document.getElementById('home-view').classList.add('hidden');
    document.getElementById('completion-view').classList.add('show');
  } else {
    document.getElementById('home-view').classList.remove('hidden');
    document.getElementById('completion-view').classList.remove('show');
  }
}

function firstIncompleteIndex() {
  const lessons = TOPICS[currentTopicIndex].lessons;
  for (let i = 0; i < lessons.length; i++) {
    if (!completed.has(lessons[i].id)) return i;
  }
  return lessons.length - 1;
}

function shuffleQuizOptions(quiz) {
  // Создаём массив с индексами [0, 1, 2]
  const indices = [0, 1, 2];
  // Перемешиваем индексы случайно
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  
  // Находим правильный ответ
  const correctAnswer = quiz.options[quiz.correct];
  
  // Создаём новый массив options в перемешанном порядке
  const shuffledOptions = indices.map(i => quiz.options[i]);
  
  // Находим новый индекс правильного ответа
  const newCorrectIndex = shuffledOptions.indexOf(correctAnswer);
  
  return {
    options: shuffledOptions,
    correct: newCorrectIndex
  };
}

function openLesson(index) {
  currentLessonIndex = index;
  const l = TOPICS[currentTopicIndex].lessons[index];
  const content = l[currentLang];
  
  // Перемешиваем вопросы
  const shuffledQuizzes = content.quizzes.map(quiz => {
    const shuffled = shuffleQuizOptions(quiz);
    return {
      q: quiz.q,
      options: shuffled.options,
      correct: shuffled.correct
    };
  });
  
  quizAnswered = new Array(shuffledQuizzes.length).fill(false);

  document.getElementById('home-view').classList.add('hidden');
  document.getElementById('lesson-view').classList.add('active');

  setText('back-btn-label', t('backBtn'));
  setText('lv-eyebrow', content.eyebrow);
  setText('lv-title', content.title);

  const body = document.getElementById('lv-body');
  const imageHtml = l.image
    ? `<img src="${l.image}" class="lesson-img" alt="${content.title}" loading="lazy" onerror="this.style.display='none'">`
    : '';
  body.innerHTML = imageHtml + content.body.map(p => `<p>${p}</p>`).join('') +
    `<div class="tip-box"><b>${t('tipLabel')}</b> ${content.tip}</div>`;

  const quizContainer = document.getElementById('lv-quiz');
  quizContainer.innerHTML = '';
  document.getElementById('complete-btn').className = 'primary-btn';
  setText('complete-btn', t('completeBtn'));

  shuffledQuizzes.forEach((quiz, qIndex) => {
    const block = document.createElement('div');
    block.className = 'quiz';
    block.style.marginTop = qIndex === 0 ? '22px' : '14px';
    block.innerHTML = `
      <div class="quiz-q">${qIndex + 1}. ${quiz.q}</div>
      <div class="quiz-opts-${qIndex}"></div>
      <div class="quiz-feedback" id="quiz-feedback-${qIndex}"></div>
    `;
    quizContainer.appendChild(block);

    const optsWrap = block.querySelector(`.quiz-opts-${qIndex}`);
    quiz.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'quiz-opt';
      btn.textContent = opt;
      btn.onclick = () => answerQuiz(qIndex, i, quiz.correct);
      optsWrap.appendChild(btn);
    });
  });

  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  window.scrollTo(0, 0);
}

function answerQuiz(quizIndex, chosen, correct) {
  const block = document.querySelectorAll('#lv-quiz .quiz')[quizIndex];
  const opts = block.querySelectorAll('.quiz-opt');
  opts.forEach((btn, i) => {
    btn.onclick = null;
    if (i === correct) btn.classList.add('correct');
    else if (i === chosen) btn.classList.add('wrong');
  });
  const feedback = document.getElementById(`quiz-feedback-${quizIndex}`);
  feedback.textContent = chosen === correct ? t('correctFeedback') : t('wrongFeedback');
  feedback.classList.add('show');

  quizAnswered[quizIndex] = true;
  if (quizAnswered.every(Boolean)) {
    document.getElementById('complete-btn').classList.add('show');
  }

  if (tg && tg.HapticFeedback) {
    tg.HapticFeedback.notificationOccurred(chosen === correct ? 'success' : 'error');
  }
}

async function completeLesson() {
  const l = TOPICS[currentTopicIndex].lessons[currentLessonIndex];
  completed.add(l.id);
  await Storage.set('completed_lessons', JSON.stringify([...completed]));
  renderHome();
}

function goHome() {
  renderHome(true);
}

init();
