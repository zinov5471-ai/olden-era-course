<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Olden Era: С нуля / From Scratch</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14121F;
    --bg-elevated: #1D1A2E;
    --gold: #C9A15C;
    --gold-dim: #7A6538;
    --violet: #8B6FC9;
    --parchment: #EDE6D6;
    --parchment-dim: #A8A2B8;
    --danger: #C9605C;
    --success: #6FA97A;
    --radius: 14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background: radial-gradient(ellipse at top, #201C33 0%, var(--bg) 55%);
    color: var(--parchment);
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  h1,h2,h3, .display{
    font-family: 'Cinzel', serif;
    letter-spacing: 0.02em;
  }
  #app{
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 18px 40px;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* ---------- Language select screen ---------- */
  .lang-view{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height: 90vh;
    text-align:center;
  }
  .lang-view .badge{
    font-size: 40px;
    margin-bottom: 16px;
  }
  .lang-view h1{
    font-size: 24px;
    margin: 0 0 8px;
  }
  .lang-view p{
    color: var(--parchment-dim);
    font-size: 14px;
    margin: 0 0 28px;
  }
  .lang-options{
    display:flex;
    flex-direction:column;
    gap: 12px;
    width: 100%;
    max-width: 320px;
  }
  .lang-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    background: var(--bg-elevated);
    border: 1px solid rgba(201,161,92,0.2);
    color: var(--parchment);
    font-family:'Manrope';
    font-weight: 700;
    font-size: 15px;
    padding: 16px;
    border-radius: 12px;
    cursor:pointer;
  }
  .lang-btn:active{ transform: scale(0.98); }
  .lang-btn .flag{ font-size: 20px; }

  /* ---------- Header ---------- */
  .app-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 18px;
  }
  .app-header .eyebrow{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--gold);
    font-weight: 700;
  }
  .app-header h1{
    font-size: 22px;
    margin: 2px 0 0;
    color: var(--parchment);
  }
  .lang-toggle{
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(201,161,92,0.2);
    color: var(--parchment-dim);
    font-family:'Manrope';
    font-size: 12px;
    font-weight: 700;
    padding: 7px 12px;
    border-radius: 20px;
    cursor:pointer;
    flex-shrink:0;
  }

  /* ===== ПРОГРЕСС-БАР ===== */
  .progress-wrap {
    margin: 12px 0 18px;
  }
  .progress-label-row {
  display: flex;
  justify-content: space-between;
  font-size: 15px;
  font-weight: 700;
  color: var(--parchment);
  margin-bottom: 6px;
}
  .progress-track {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    border-radius: 4px;
    transition: width 0.6s ease;
  }

  /* ===== КНОПКА YOUTUBE (в стиле доната) ===== */
.youtube-btn {
  display: block;
  width: 100%;
  text-align: center;
  background: none;
  border: none;
  color: var(--parchment-dim);
  font-family: 'Manrope', sans-serif;
  font-size: 12.5px;
  padding: 18px 0 4px;
  cursor: pointer;
  opacity: 0.7;
  transition: opacity 0.2s ease;
}
.youtube-btn:active {
  opacity: 1;
  transform: scale(0.98);
}

  /* ---------- Charge indicator (signature element) ---------- */
  .charges{
    display:flex;
    gap: 6px;
    margin-top: 10px;
  }
  .charge-dot{
    flex:1;
    height: 6px;
    border-radius: 4px;
    background: rgba(255,255,255,0.08);
    position: relative;
    overflow: hidden;
  }
  .charge-dot.filled{
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    box-shadow: 0 0 10px rgba(201,161,92,0.55);
  }
  .charge-dot.current::after{
    content:'';
    position:absolute;
    inset:0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    animation: shimmer 1.8s infinite;
  }
  @keyframes shimmer{
    0%{ transform: translateX(-100%);}
    100%{ transform: translateX(100%);}
  }

  .progress-label{
    font-size: 12px;
    color: var(--parchment-dim);
    margin-top: 8px;
  }

  /* ---------- Lesson list ---------- */
  .lesson-list{
    display:flex;
    flex-direction:column;
    gap: 10px;
    margin-top: 18px;
  }
  .lesson-card{
    display:flex;
    align-items:center;
    gap: 14px;
    background: var(--bg-elevated);
    border: 1px solid rgba(201,161,92,0.12);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor:pointer;
    transition: transform .15s ease, border-color .15s ease;
  }
  .lesson-card:active{ transform: scale(0.98); }
  .lesson-card.done{ border-color: rgba(111,169,122,0.4); }
  .lesson-card.locked{ opacity: 0.45; }
  .lesson-num{
    font-family:'Cinzel', serif;
    font-size: 13px;
    font-weight: 700;
    width: 30px;
    height:30px;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(201,161,92,0.12);
    color: var(--gold);
    flex-shrink:0;
  }
  .lesson-card.done .lesson-num{
    background: rgba(111,169,122,0.18);
    color: var(--success);
  }
  .lesson-title{
    font-size: 15px;
    font-weight: 700;
    color: var(--parchment);
  }
  .lesson-sub{
    font-size: 12px;
    color: var(--parchment-dim);
    margin-top: 2px;
  }
  .lesson-check{
    margin-left:auto;
    font-size: 18px;
    color: var(--success);
  }
  .topic-icon{
    font-size: 20px;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: rgba(201,161,92,0.1);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .topic-progress{
    font-size: 11px;
    color: var(--parchment-dim);
    margin-top: 2px;
  }
  .soon-badge{
    margin-left:auto;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
    color: var(--parchment-dim);
    background: rgba(255,255,255,0.06);
    padding: 4px 10px;
    border-radius: 20px;
    flex-shrink:0;
  }
  .lesson-card.soon{
    opacity: 0.6;
    cursor: default;
  }
  .lesson-card.soon:active{ transform: none; }
  .support-link{
    display:block;
    width:100%;
    text-align:center;
    background: none;
    border: none;
    color: var(--parchment-dim);
    font-family:'Manrope';
    font-size: 12.5px;
    padding: 18px 0 4px;
    cursor:pointer;
    opacity: 0.7;
  }
  .support-link:active{ opacity: 1; }

  /* ---------- Lesson view ---------- */
  .lesson-view{ display:none; }
  .lesson-view.active{ display:block; }
  #lang-view.hidden{ display:none; }

  /* ===== ОТДЕЛЬНЫЕ СТРАНИЦЫ С АНИМАЦИЕЙ ===== */
  #topics-view,
  #home-view,
  #lesson-view {
    position: relative;
    transition: opacity 0.35s ease, transform 0.35s ease;
    background: transparent;
    padding: 0;
    min-height: 80vh;
  }

  /* Скрытые страницы */
  #topics-view.hidden,
  #home-view.hidden,
  #lesson-view.hidden {
    display: block !important;
    opacity: 0;
    transform: translateX(30px);
    pointer-events: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    min-height: 80vh;
  }

  /* Видимые страницы */
  #topics-view:not(.hidden),
  #home-view:not(.hidden),
  #lesson-view:not(.hidden) {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
    position: relative;
  }

  /* Анимация входа */
  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateX(30px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  #home-view:not(.hidden) {
    animation: slideIn 0.35s ease forwards;
  }

  #lesson-view.active {
    animation: slideIn 0.35s ease forwards;
  }

  .back-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:none;
  border:none;
  color: var(--gold);
  font-family:'Manrope';
  font-size: 15px;
  font-weight: 700;
  padding: 8px 0;
  margin-bottom: 10px;
  cursor:pointer;
  transition: opacity 0.2s ease;
}
.back-btn:active {
  opacity: 0.6;
}
  .lesson-eyebrow{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--violet);
    font-weight: 700;
  }
  .lesson-view h2{
    font-size: 20px;
    margin: 6px 0 14px;
    color: var(--parchment);
  }
  .lesson-body p{
    font-size: 15px;
    line-height: 1.6;
    color: var(--parchment);
    margin: 0 0 14px;
  }
  .lesson-img{
    width: 100%;
    border-radius: var(--radius);
    display: block;
    margin-bottom: 16px;
    border: 1px solid rgba(201,161,92,0.18);
    background: rgba(255,255,255,0.03);
  }
  .tip-box{
    background: rgba(139,111,201,0.12);
    border-left: 3px solid var(--violet);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--parchment);
    margin: 16px 0;
  }
  .tip-box b{ color: var(--violet); }

  /* ---------- Quiz ---------- */
  .quiz{
    margin-top: 22px;
    background: var(--bg-elevated);
    border-radius: var(--radius);
    padding: 16px;
    border: 1px solid rgba(201,161,92,0.15);
  }
  .quiz-q{
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--parchment);
  }
  .quiz-opt{
    display:block;
    width:100%;
    text-align:left;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--parchment);
    font-family:'Manrope';
    font-size: 13.5px;
    padding: 11px 14px;
    border-radius: 10px;
    margin-bottom: 8px;
    cursor:pointer;
  }
  .quiz-opt.correct{
    border-color: var(--success);
    background: rgba(111,169,122,0.15);
  }
  .quiz-opt.wrong{
    border-color: var(--danger);
    background: rgba(201,96,92,0.15);
  }
  .quiz-feedback{
    font-size: 13px;
    margin-top: 8px;
    color: var(--parchment-dim);
    display:none;
  }
  .quiz-feedback.show{ display:block; }

  .primary-btn{
    width:100%;
    background: linear-gradient(135deg, var(--gold), var(--gold-dim));
    color: #1A1508;
    font-family:'Manrope';
    font-weight: 800;
    font-size: 15px;
    border:none;
    border-radius: 12px;
    padding: 14px;
    margin-top: 20px;
    cursor:pointer;
    display:none;
  }
  .primary-btn.show{ display:block; }
  .primary-btn:active{ transform: scale(0.98); }

  /* ---------- Completion ---------- */
  .completion{
    text-align:center;
    padding: 40px 10px;
    display:none;
  }
  .completion.show{ display:block; }
  .completion .badge{
    font-size: 48px;
    margin-bottom: 12px;
  }

  /* Визуальный разделитель страниц */
  .page-divider {
    background: linear-gradient(90deg, var(--gold-dim), var(--gold), var(--gold-dim));
    height: 2px;
    margin: 4px 0 18px;
    opacity: 0.3;
    border-radius: 2px;
  }
  /* ===== ФОРМА ОБРАТНОЙ СВЯЗИ ===== */
.feedback-form {
  display: none;
  margin-top: 16px;
  padding: 16px;
  background: var(--bg-elevated);
  border-radius: var(--radius);
  border: 1px solid rgba(201,161,92,0.15);
}
.feedback-form-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--parchment);
}
.feedback-textarea {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05);
  color: var(--parchment);
  font-family: 'Manrope', sans-serif;
  font-size: 14px;
  resize: vertical;
  box-sizing: border-box;
}
.feedback-textarea:focus {
  outline: none;
  border-color: var(--gold);
}
.feedback-btns {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}
.feedback-send {
  flex: 1;
  padding: 10px;
  background: linear-gradient(135deg, var(--gold), var(--gold-dim));
  color: #1A1508;
  font-weight: 700;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-family: 'Manrope', sans-serif;
  font-size: 14px;
}
.feedback-send:active {
  transform: scale(0.98);
}
.feedback-cancel {
  flex: 1;
  padding: 10px;
  background: rgba(255,255,255,0.05);
  color: var(--parchment-dim);
  font-weight: 700;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  cursor: pointer;
  font-family: 'Manrope', sans-serif;
  font-size: 14px;
}
.feedback-cancel:active {
  transform: scale(0.98);
}
    /* другие стили ... */
  .support-link:active{ opacity: 1; }

    /* ===== КНОПКА "НАВЕРХ" ===== */
  .scroll-top {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-dim), var(--gold));
    color: #1A1508;
    border: none;
    font-size: 22px;
    cursor: pointer;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 999;
    box-shadow: 0 4px 20px rgba(201,161,92,0.3);
  }
  .scroll-top.visible {
    opacity: 1;
    transform: scale(1);
  }
  .scroll-top:active {
    transform: scale(0.9);
  }
#feedback-view {
  position: relative;
  transition: opacity 0.35s ease, transform 0.35s ease;
  background: transparent;
  padding: 0;
  min-height: 80vh;
}
#feedback-view.hidden {
  display: block !important;
  opacity: 0;
  transform: translateX(30px);
  pointer-events: none;
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  min-height: 80vh;
}
#feedback-view:not(.hidden) {
  opacity: 1;
  transform: translateX(0);
  pointer-events: auto;
  position: relative;
  animation: slideIn 0.35s ease forwards;
}
   
   @keyframes slideIn {
  from { opacity: 0; transform: translateX(30px); }
  to { opacity: 1; transform: translateX(0); }
}



</style>
</style>
</head>
<body>

<div id="app">

  <!-- LANGUAGE SELECT VIEW -->
  <div class="lang-view" id="lang-view">
    <div class="badge">📜</div>
    <h1>Olden Era</h1>
    <p>Choose your language / Выберите язык</p>
    <div class="lang-options">
      <button class="lang-btn" onclick="selectLanguage('ru')"><span class="flag">🇷🇺</span> Русский</button>
      <button class="lang-btn" onclick="selectLanguage('en')"><span class="flag">🇬🇧</span> English</button>
    </div>
  </div>

  <!-- TOPICS VIEW -->
  <div id="topics-view">
    <div class="app-header">
      <div>
        <div class="eyebrow" id="topics-eyebrow"></div>
        <h1 id="topics-title"></h1>
      </div>
      <button class="lang-toggle" onclick="toggleLanguage()" id="topics-lang-toggle-btn"></button>
    </div>

    <!-- ПРОГРЕСС-БАР -->
    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-label-row">
        <span> 📚 Прогресс обучения </span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-bar" style="width: 0%;"></div>
      </div>
    </div>

    <div class="lesson-list" id="topics-list"></div>
    
    <button class="support-link" onclick="openDonate()" id="support-link-label"></button>
    
    <!-- КНОПКА YOUTUBE -->
    <button class="youtube-btn" onclick="openYouTube()">
      ▶️ Подписаться на YouTube
    <!-- КНОПКА ОБРАТНОЙ СВЯЗИ -->
     <button class="support-link" onclick="openFeedbackPage()">✉️ Обратная связь</button>
    </button>
  </div>

 
</button>

<!-- ФОРМА ОБРАТНОЙ СВЯЗИ -->
<div class="feedback-form" id="feedback-form">
  <div class="feedback-form-title">✉️ Напишите нам</div>
  <textarea class="feedback-textarea" id="feedback-text" rows="3" placeholder="Ваше сообщение, предложение или вопрос..."></textarea>
  <div class="feedback-btns">
    <button class="feedback-send" onclick="sendFeedback()">📤 Отправить</button>
    <button class="feedback-cancel" onclick="closeFeedbackForm()">❌ Отмена</button>
  </div>
</div>
  <!-- HOME VIEW (lessons within a topic) -->
  <div id="home-view" class="hidden">
    <button class="back-btn" onclick="goTopics()" id="topics-back-label">← Темы</button>
    <div class="page-divider"></div>
    <div class="app-header">
      <div>
        <div class="eyebrow" id="home-eyebrow"></div>
        <h1 id="home-title"></h1>
      </div>
      <button class="lang-toggle" onclick="toggleLanguage()" id="lang-toggle-btn"></button>
    </div>

    <div class="charges" id="charges-row"></div>
    <div class="progress-label" id="progress-label"></div>

    <div class="lesson-list" id="lesson-list"></div>
  </div>

  <!-- LESSON VIEW -->
  <div class="lesson-view" id="lesson-view">
    <button class="back-btn" onclick="goHome()" id="back-btn-label">← Все уроки</button>
    <div class="page-divider"></div>
    <div class="lesson-eyebrow" id="lv-eyebrow"></div>
    <h2 id="lv-title"></h2>
    <div class="lesson-body" id="lv-body"></div>

    <div id="lv-quiz"></div>

    <button class="primary-btn" id="complete-btn" onclick="completeLesson()"></button>
  </div>

<!-- FEEDBACK VIEW (отдельная страница с формой) -->
<div id="feedback-view" class="hidden" style="padding: 20px 0;">
  <button class="back-btn" onclick="goTopics()" id="feedback-back-label">← На главную</button>
  <div class="page-divider"></div>
  <div class="app-header">
    <div>
      <div class="eyebrow">📩 Обратная связь</div>
      <h1>Напишите нам</h1>
    </div>
  </div>
  <div style="margin-top: 20px;">
    <textarea id="feedback-text-new" rows="6" placeholder="Ваше сообщение, предложение или вопрос..." style="width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: var(--parchment); font-family: 'Manrope', sans-serif; font-size: 15px; resize: vertical; box-sizing: border-box;"></textarea>
    <div style="display: flex; gap: 12px; margin-top: 16px;">
      <button onclick="sendFeedbackNew()" style="flex: 1; padding: 14px; background: linear-gradient(135deg, var(--gold), var(--gold-dim)); color: #1A1508; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; font-family: 'Manrope', sans-serif; font-size: 15px;">📤 Отправить</button>
      <button onclick="goTopics()" style="flex: 1; padding: 14px; background: rgba(255,255,255,0.05); color: var(--parchment-dim); font-weight: 700; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; cursor: pointer; font-family: 'Manrope', sans-serif; font-size: 15px;">❌ Отмена</button>
    </div>
    <div id="feedback-status" style="margin-top: 12px; font-size: 14px; color: var(--parchment-dim); text-align: center; display: none;"></div>
  </div>
   </div>



  <!-- COMPLETION VIEW -->
  <div class="completion" id="completion-view">
    <div class="badge">🏆</div>
    <h2 id="completion-title"></h2>
    <p style="color:var(--parchment-dim); font-size:14px;" id="completion-text"></p>

// ---------- Storage: Telegram CloudStorage with localStorage fallback ----------
function cloudStorageAvailable() {
  try {
    if (!tg || !tg.CloudStorage) return false;
    if (typeof tg.isVersionAtLeast === 'function') {
      return tg.isVersionAtLeast('6.9');
    }
    return true;
  } catch (e) {
    return false;
  }
}

function withTimeout(promise, ms, fallbackValue) {
  return Promise.race([
    promise,
    new Promise((resolve) => setTimeout(() => resolve(fallbackValue), ms))
  ]);
}

const Storage = {
  async get(key) {
    if (!cloudStorageAvailable()) {
      return localStorage.getItem(key);
    }
    const cloudPromise = new Promise((resolve) => {
      try {
        tg.CloudStorage.getItem(key, (err, value) => resolve(err ? null : value));
      } catch (e) {
        resolve(localStorage.getItem(key));
      }
    });
    return withTimeout(cloudPromise, 1200, localStorage.getItem(key));
  },
  async set(key, value) {
    if (!cloudStorageAvailable()) {
      localStorage.setItem(key, value);
      return;
    }
    const cloudPromise = new Promise((resolve) => {
      try {
        tg.CloudStorage.setItem(key, value, () => resolve());
      } catch (e) {
        localStorage.setItem(key, value);
        resolve();
      }
    });
    await withTimeout(cloudPromise, 1200, null);
    localStorage.setItem(key, value);
  }
};

    topic.lessons.forEach(lesson => {
      totalLessons++;
      if (completed.has(lesson.id)) completedLessons++;

let currentTopicIndex = null;
let completed = new Set();
let currentLessonIndex = null;
let quizAnswered = [];

// ---------- Language handling ----------
async function selectLanguage(lang) {
  try {
    currentLang = lang;
    await Storage.set('lang', lang);
    document.getElementById('lang-view').classList.add('hidden');
    document.getElementById('topics-view').classList.remove('hidden');
    renderTopics();
  } catch (e) {
    console.error('selectLanguage error:', e);
  }
}

async function toggleLanguage() {
  currentLang = currentLang === 'ru' ? 'en' : 'ru';
  await Storage.set('lang', currentLang);
  if (!document.getElementById('home-view').classList.contains('hidden')) {
    renderHome(true);
  } else {
    renderTopics();
  }
}

function t(key, ...args) {
  const val = STRINGS[currentLang][key];
  return typeof val === 'function' ? val(...args) : val;
}

// ---------- Init ----------
// ---------- Visitor counter (private, checked only via the key's URL) ----------
const VISIT_COUNTER_KEY = 'charmroad_olden_era_bot_unique_visitors_2026';

async function countFirstVisit() {
  try {
    const alreadyCounted = await Storage.get('visit_counted');
    if (alreadyCounted) return;
    await fetch(`https://countapi.mileshilliard.com/api/v1/hit/${VISIT_COUNTER_KEY}`);
    await Storage.set('visit_counted', '1');
  } catch (e) {
    // Silently ignore — never block the app if the counter service is unavailable
    console.error('Visit counter failed:', e);
  }
}

async function init() {
  const savedLang = await Storage.get('lang');
  const saved = await Storage.get('completed_lessons');
  if (saved) {
    try { completed = new Set(JSON.parse(saved)); } catch(e) {}
  }

  countFirstVisit();
  updateProgress(); // <-- обновляем прогресс при загрузке

  if (savedLang === 'ru' || savedLang === 'en') {
    currentLang = savedLang;
    document.getElementById('lang-view').classList.add('hidden');
    document.getElementById('topics-view').classList.remove('hidden');
    renderTopics();
  }
}

// ---------- Topics screen ----------
function topicProgress(topic) {
  const done = topic.lessons.filter(l => completed.has(l.id)).length;
  return { done, total: topic.lessons.length };
}

function renderTopics() {
  document.getElementById('lesson-view').classList.remove('active');
  document.getElementById('completion-view').classList.remove('show');
  document.getElementById('home-view').classList.add('hidden');
  document.getElementById('topics-view').classList.remove('hidden');

  setText('topics-eyebrow', t('topicsEyebrow'));
  setText('topics-title', t('topicsTitle'));
  setText('topics-lang-toggle-btn', t('langToggle'));
  setText('support-link-label', t('supportLink'));

  const list = document.getElementById('topics-list');
  list.innerHTML = '';
  TOPICS.forEach((topic, i) => {
    const content = topic[currentLang];
    const isEmpty = topic.lessons.length === 0;
    const { done, total } = topicProgress(topic);
    const card = document.createElement('div');
    card.className = 'lesson-card' + (isEmpty ? ' soon' : '');
    card.onclick = () => openTopic(i);
    card.innerHTML = `
      <div class="topic-icon">${topic.icon}</div>
      <div>
        <div class="lesson-title">${content.title}</div>
        <div class="topic-progress">${isEmpty ? '' : t('progressLabel', done, total)}</div>
      </div>
      ${isEmpty ? `<div class="soon-badge">${t('comingSoon')}</div>` : (done === total ? '<div class="lesson-check">✓</div>' : '')}
    `;
    list.appendChild(card);
  });
  
  updateProgress(); // <-- обновляем прогресс при отрисовке списка тем
}

function openTopic(index) {
  const topic = TOPICS[index];
  if (topic.lessons.length === 0) return; // coming soon, not clickable
  currentTopicIndex = index;
  document.getElementById('topics-view').classList.add('hidden');
  document.getElementById('home-view').classList.remove('hidden');
  renderHome();
}

function goTopics() {
  renderTopics();
}

function renderHome(forceList) {
  const topic = TOPICS[currentTopicIndex];
  const lessons = topic.lessons;
  const total = lessons.length;

  setText('home-eyebrow', topic[currentLang].title);
  setText('home-title', t('homeTitle'));
  setText('topics-back-label', t('backToTopics'));
  setText('lang-toggle-btn', t('langToggle'));
  setText('back-btn-label', t('backBtn'));
  setText('complete-btn', t('completeBtn'));
  setText('completion-title', t('completionTitle'));
  setText('completion-text', t('completionText'));
  setText('completion-btn', t('completionBtn'));
  setText('completion-support-label', t('supportLink'));

  const chargesRow = document.getElementById('charges-row');
  chargesRow.innerHTML = '';
  lessons.forEach((l, i) => {
    const dot = document.createElement('div');
    dot.className = 'charge-dot' + (completed.has(l.id) ? ' filled' : '') + (i === firstIncompleteIndex() ? ' current' : '');
    chargesRow.appendChild(dot);
  });
  const doneCount = lessons.filter(l => completed.has(l.id)).length;
  setText('progress-label', t('progressLabel', doneCount, total));

  const list = document.getElementById('lesson-list');
  list.innerHTML = '';
  lessons.forEach((l, i) => {
    const content = l[currentLang];
    const card = document.createElement('div');
    const isDone = completed.has(l.id);
    card.className = 'lesson-card' + (isDone ? ' done' : '');
    card.onclick = () => openLesson(i);
    card.innerHTML = `
      <div class="lesson-num">${i+1}</div>
      <div>
        <div class="lesson-title">${content.title}</div>
        <div class="lesson-sub">${content.eyebrow}</div>
      </div>
      ${isDone ? '<div class="lesson-check">✓</div>' : ''}
    `;
    list.appendChild(card);
  });

  document.getElementById('lesson-view').classList.remove('active');

  if (!forceList && total > 0 && doneCount === total) {
    document.getElementById('home-view').classList.add('hidden');
    document.getElementById('completion-view').classList.add('show');
  } else {
    document.getElementById('home-view').classList.remove('hidden');
    document.getElementById('completion-view').classList.remove('show');
  }
  
  updateProgress(); // <-- обновляем прогресс
}

function firstIncompleteIndex() {
  const lessons = TOPICS[currentTopicIndex].lessons;
  for (let i = 0; i < lessons.length; i++) {
    if (!completed.has(lessons[i].id)) return i;
  }
  return lessons.length - 1;
}

function shuffleQuizOptions(quiz) {
  // Создаём массив с индексами [0, 1, 2]
  const indices = [0, 1, 2];
  // Перемешиваем индексы случайно
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  
  // Находим правильный ответ
  const correctAnswer = quiz.options[quiz.correct];
  
  // Создаём новый массив options в перемешанном порядке
  const shuffledOptions = indices.map(i => quiz.options[i]);
  
  // Находим новый индекс правильного ответа
  const newCorrectIndex = shuffledOptions.indexOf(correctAnswer);
  
  return {
    options: shuffledOptions,
    correct: newCorrectIndex
  };
}

function openLesson(index) {
  currentLessonIndex = index;
  const l = TOPICS[currentTopicIndex].lessons[index];
  const content = l[currentLang];
  
  // Перемешиваем вопросы
  const shuffledQuizzes = content.quizzes.map(quiz => {
    const shuffled = shuffleQuizOptions(quiz);
    return {
      q: quiz.q,
      options: shuffled.options,
      correct: shuffled.correct
    };
  });
  
  quizAnswered = new Array(shuffledQuizzes.length).fill(false);

  document.getElementById('home-view').classList.add('hidden');
  document.getElementById('lesson-view').classList.add('active');

  setText('back-btn-label', t('backBtn'));
  setText('lv-eyebrow', content.eyebrow);
  setText('lv-title', content.title);

  const body = document.getElementById('lv-body');
  const imageHtml = l.image
    ? `<img src="${l.image}" class="lesson-img" alt="${content.title}" loading="lazy" onerror="this.style.display='none'">`
    : '';
  body.innerHTML = imageHtml + content.body.map(p => `<p>${p}</p>`).join('') +
    `<div class="tip-box"><b>${t('tipLabel')}</b> ${content.tip}</div>`;

  const quizContainer = document.getElementById('lv-quiz');
  quizContainer.innerHTML = '';
  document.getElementById('complete-btn').className = 'primary-btn';
  setText('complete-btn', t('completeBtn'));

  shuffledQuizzes.forEach((quiz, qIndex) => {
    const block = document.createElement('div');
    block.className = 'quiz';
    block.style.marginTop = qIndex === 0 ? '22px' : '14px';
    block.innerHTML = `
      <div class="quiz-q">${qIndex + 1}. ${quiz.q}</div>
      <div class="quiz-opts-${qIndex}"></div>
      <div class="quiz-feedback" id="quiz-feedback-${qIndex}"></div>
    `;
    quizContainer.appendChild(block);

    const optsWrap = block.querySelector(`.quiz-opts-${qIndex}`);
    quiz.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'quiz-opt';
      btn.textContent = opt;
      btn.onclick = () => answerQuiz(qIndex, i, quiz.correct);
      optsWrap.appendChild(btn);
    });
  });

  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  window.scrollTo(0, 0);
}

function answerQuiz(quizIndex, chosen, correct) {
  const block = document.querySelectorAll('#lv-quiz .quiz')[quizIndex];
  const opts = block.querySelectorAll('.quiz-opt');
  opts.forEach((btn, i) => {
    btn.onclick = null;
    if (i === correct) btn.classList.add('correct');
    else if (i === chosen) btn.classList.add('wrong');
  });
  const feedback = document.getElementById(`quiz-feedback-${quizIndex}`);
  feedback.textContent = chosen === correct ? t('correctFeedback') : t('wrongFeedback');
  feedback.classList.add('show');

  quizAnswered[quizIndex] = true;
  if (quizAnswered.every(Boolean)) {
    document.getElementById('complete-btn').classList.add('show');
  }

  if (tg && tg.HapticFeedback) {
    tg.HapticFeedback.notificationOccurred(chosen === correct ? 'success' : 'error');
  }
}

async function completeLesson() {
  const l = TOPICS[currentTopicIndex].lessons[currentLessonIndex];
  completed.add(l.id);
  await Storage.set('completed_lessons', JSON.stringify([...completed]));
  updateProgress(); // <-- обновляем прогресс после завершения урока
  renderHome();
}
function goHome() {
  renderHome(true);
