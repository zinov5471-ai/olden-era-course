name: Deploy with Secrets

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace secrets in index.html
        run: |
          sed -i "s|%%BOT_TOKEN%%|${{ secrets.BOT_TOKEN }}|g" index.html
          sed -i "s|%%ADMIN_CHAT_ID%%|${{ secrets.ADMIN_CHAT_ID }}|g" index.html

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Add secrets to index.html"
          git push
