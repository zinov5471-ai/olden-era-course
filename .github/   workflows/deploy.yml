name: Deploy with Secrets

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace secrets in index.html
        run: |
          sed -i "s|%%BOT_TOKEN%%|${{ secrets.BOT_TOKEN }}|g" index.html
          sed -i "s|%%ADMIN_CHAT_ID%%|${{ secrets.ADMIN_CHAT_ID }}|g" index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
